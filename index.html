<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GDS-1102B Simülatörü</title>
<meta name="description" content="GW Instek GDS-1102B osiloskop simülatörü, devre tezgâhı ve adım adım laboratuvar kılavuzu. Tarayıcıda çalışır.">
<meta name="theme-color" content="#f08a1c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<!--
  GW Instek GDS-1102B dijital depolamalı osiloskop simülatörü + devre tezgâhı + EE212 Lab 1 kılavuzu.
  Tek dosya; harici kütüphane yok. Kaynak modüller: src/*.js  (build.js ile birleştirilir)
  Modüller:  Units · MNA · Bench(model) · Sim · State · Acq · Measure · MathFn · Renderer · Menus · Panel · BenchUI · Tests · App · Guide
  Referans: GDS-1000B Series User Manual (GW Instek). Kılavuzdan doğrulanamayan detaylar kodda "TAHMIN:" ile işaretlidir.
-->
<style>
:root{
  --bg:#1a1d22; --bg2:#23272e; --bg3:#2b3038; --fg:#e7eaee; --muted:#9aa3ad; --accent:#f08a1c; --accent2:#ffb25c;
  --ch1:#ffe14a; --ch2:#4fc3ff; --math:#ff4a4a; --ref:#ffffff;
  --panel-border:#383e47; --warn:#ff6a4a; --ok:#5fd17a; --info:#6fb6ff;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 "Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:7px 14px;background:#121418;border-bottom:1px solid var(--panel-border);flex-wrap:wrap;position:sticky;top:0;z-index:40}
header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.3px;white-space:nowrap}
header h1 span{color:var(--accent)}
header .sp{flex:1}
header label{display:flex;align-items:center;gap:6px;color:var(--muted)}
button.ui, select.ui{background:#2f353d;color:var(--fg);border:1px solid #4a525c;border-radius:6px;padding:5px 11px;font:inherit;cursor:pointer;transition:background .15s,border-color .15s,transform .08s}
button.ui:hover, select.ui:hover{background:#3a414a;border-color:#6a737e}
button.ui:active{transform:translateY(1px)}
button.ui.primary{background:#8a4a0e;border-color:#c4701f}
button.ui.primary:hover{background:#a2580f}
button.ui.on{background:#24496f;border-color:#4f8fd0}
button.ui.sm{padding:2px 8px;font-size:12px;border-radius:5px}
kbd{background:#333a42;border:1px solid #59616b;border-bottom-width:2px;border-radius:4px;padding:0 5px;font:11px Consolas,monospace;color:#e8e8e8;white-space:nowrap}

#layout{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:12px;padding:10px 12px 24px;align-items:start;transition:grid-template-columns .3s var(--ease)}
#layout.noguide{grid-template-columns:minmax(0,1fr) 0px}
#layout.noguide #guide{opacity:0;pointer-events:none}
#leftCol{display:flex;flex-direction:column;align-items:safe center;gap:8px;min-width:0;overflow-x:auto}
#viewBar{flex-wrap:wrap;gap:5px;padding:4px 10px;min-height:0;font-size:12px;color:var(--muted)}
#viewBar .vl{color:#cdd3da;font-weight:600;margin-right:2px}
#viewBar .vz{min-width:42px;text-align:center;color:#fff;font:12px Consolas,monospace}
#viewBar .vsep{flex:1}
#scopeWrap:fullscreen{width:min(100vw, calc(100vh * 1.935)) !important;margin:auto;background:#111;display:block}
#scopeWrap:fullscreen svg{height:100%}
#lens{position:absolute;display:none;border-radius:50%;border:3px solid #f08a1c;box-shadow:0 6px 24px rgba(0,0,0,.7);pointer-events:none;z-index:6}
.zgrp{display:inline-flex;align-items:center;gap:2px;margin-left:6px;padding-left:8px;border-left:1px solid #444c56}
#bZlbl{min-width:40px;text-align:center;font:12px Consolas,monospace;color:#fff}
#benchSvg.active{outline:2px solid rgba(240,138,28,.45);outline-offset:-2px}
#scopeWrap{position:relative;width:min(100%, calc((100vh - 150px) * 1.935));min-width:min(100%,640px);max-width:1320px;user-select:none;-webkit-user-select:none}
#scopeWrap svg{display:block;width:100%;height:auto}
#screen{position:absolute;image-rendering:auto;background:#000}
#hud{position:absolute;left:33.3%;top:16%;transform:translate(-50%,-6px);background:rgba(16,22,32,.88);border:1px solid #f08a1c;color:#fff;border-radius:8px;padding:5px 14px;font:600 15px "Segoe UI",Arial;pointer-events:none;opacity:0;transition:opacity .25s,transform .25s var(--ease);white-space:nowrap;box-shadow:0 4px 18px rgba(0,0,0,.5)}
#hud.show{opacity:1;transform:translate(-50%,0)}
#hud small{display:block;font-weight:400;font-size:11.5px;color:#ffc27a;text-align:center}

/* Akıllı ipucu + klavye çubuğu */
.bar{width:100%;max-width:1320px;display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--panel-border);border-radius:8px;padding:7px 12px;min-height:40px}
#tipBar{transition:border-color .3s,background .3s}
#tipBar.warn{border-color:#c4581f;background:#2e2420}
#tipBar.good{border-color:#3f8a52}
#tipIcon{font-size:18px;flex:none}
#tipText{flex:1;transition:opacity .3s}
#tipText b{color:var(--accent2)}
#tipActs{display:flex;gap:6px;flex:none}

/* Devre tezgâhı */
#benchWrap{width:100%;max-width:1320px;background:var(--bg2);border:1px solid var(--panel-border);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:8px}
#benchHead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#benchHead h2{margin:0 6px 0 2px;font-size:14px;font-weight:600}
#benchHead .hint{color:var(--muted);font-size:12px;flex:1;min-width:200px}
#benchBody{display:grid;grid-template-columns:120px minmax(0,1fr) 290px;gap:8px}
#palette{display:flex;flex-direction:column;gap:5px}
#palette .pal{display:flex;align-items:center;gap:6px;padding:5px 6px;background:#323840;border:1px solid #474f59;border-radius:6px;cursor:grab;font-size:12px;transition:background .15s,transform .1s}
#palette .pal:hover{background:#3d444d;transform:translateX(2px)}
#palette .pal svg{width:34px;height:20px;flex:none}
#palette .palHint{color:var(--muted);font-size:11px;margin-top:4px;line-height:1.35}
#benchSvgBox{position:relative;background:#f4f1e8;border-radius:8px;overflow:hidden;min-height:440px}
#benchSvg{width:100%;height:100%;display:block;min-height:440px;cursor:default}
#props{background:var(--bg3);border:1px solid #444c56;border-radius:8px;padding:9px;font-size:12px;max-height:600px;overflow:auto}
#props h3{margin:0 0 6px;font-size:13px}
#props h4{margin:10px 0 4px;font-size:12px;color:var(--accent2)}
#props label{display:flex;justify-content:space-between;align-items:center;gap:6px;margin:4px 0}
#props input,#props select{width:128px;background:#1b1f24;color:var(--fg);border:1px solid #555;border-radius:4px;padding:3px 5px;font:inherit}
#props input:focus,#props select:focus{outline:none;border-color:var(--accent)}
#props input[type=range]{width:100%;accent-color:var(--accent)}
#props .hint{color:var(--muted);margin-top:6px;line-height:1.4}
#props .chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 6px}
#props .chip{background:#1f242b;border:1px solid #4b535d;color:#dde;border-radius:12px;padding:1px 8px;font-size:11.5px;cursor:pointer;transition:background .15s}
#props .chip:hover{background:#37404b}
#props .chip.on{background:#8a4a0e;border-color:#e08a2c;color:#fff}
#props .probeBox{border:1px solid #444c56;border-radius:6px;padding:6px;margin:6px 0;background:#252a31}
#props .probeBox .ttl{font-weight:700;display:flex;justify-content:space-between;align-items:center}
#props .probeBox select{width:150px}
#benchWarn{position:absolute;left:8px;top:8px;right:8px;display:none;background:rgba(160,25,10,.92);color:#fff;padding:6px 10px;border-radius:6px;font-size:12.5px;pointer-events:none;z-index:3}
#tip{position:fixed;z-index:50;pointer-events:none;background:rgba(18,20,24,.96);color:#fff;border:1px solid #f08a1c;border-radius:6px;padding:6px 9px;font-size:12px;max-width:320px;display:none;box-shadow:0 3px 12px rgba(0,0,0,.5)}
#tip b{color:#ffc072}
#tip .k{color:#9ccfff;margin-top:3px;display:block}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:60}
#modal .box{background:#23282e;border:1px solid #555;border-radius:10px;max-width:880px;width:92%;max-height:86vh;overflow:auto;padding:16px 18px}
#modal table{border-collapse:collapse;width:100%;font-size:12.5px}
#modal td,#modal th{border-bottom:1px solid #3c434b;padding:5px 6px;text-align:left;vertical-align:top}
#modal .pass{color:var(--ok);font-weight:700}
#modal .fail{color:var(--warn);font-weight:700}

/* Kılavuz paneli */
#guide{position:sticky;top:56px;height:calc(100vh - 68px);display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--panel-border);border-radius:10px;overflow:hidden;transition:opacity .25s}
#gTabs{display:flex;flex-wrap:wrap;gap:2px;padding:6px 6px 0;background:#1d2127;border-bottom:1px solid var(--panel-border)}
#gTabs button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:6px 8px;font:600 12.5px "Segoe UI",Arial;cursor:pointer;border-radius:6px 6px 0 0;transition:color .15s,background .15s,border-color .2s}
#gTabs button:hover{color:#fff;background:#2a2f37}
#gTabs button.on{color:#fff;border-bottom-color:var(--accent);background:#2a2f37}
#gBody{flex:1;overflow:auto;padding:12px 14px 30px;scroll-behavior:smooth}
#gBody h2{font-size:16px;margin:4px 0 8px}
#gBody h3{font-size:14px;margin:14px 0 6px;color:var(--accent2)}
#gBody p{margin:6px 0}
#gBody ul,#gBody ol{margin:6px 0;padding-left:20px}
#gBody li{margin:3px 0}
#gBody table{border-collapse:collapse;width:100%;font-size:12px;margin:6px 0}
#gBody td,#gBody th{border-bottom:1px solid #3a4048;padding:4px 5px;text-align:left;vertical-align:top}
#gBody th{color:var(--muted);font-weight:600}
#gBody .fade{animation:fadeIn .3s var(--ease)}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.gbox{border-radius:8px;padding:8px 10px;margin:8px 0;border:1px solid}
.gbox.why{background:#1f2a36;border-color:#35506e}
.gbox.why::before{content:"🤔 Neden? ";font-weight:700;color:#8fc4ff}
.gbox.see{background:#1e2c22;border-color:#36603f}
.gbox.see::before{content:"👀 Ekranda ne görmelisin? ";font-weight:700;color:#7fe095}
.gbox.warn{background:#2e2420;border-color:#7a4423}
.gbox.warn::before{content:"⚠️ Dikkat: ";font-weight:700;color:#ffaa70}
.gbox.tip{background:#2a2720;border-color:#6b5a2a}
.gbox.tip::before{content:"💡 İpucu: ";font-weight:700;color:#ffd36a}
.gbox.simple{background:#262033;border-color:#57487a}
.gbox.simple::before{content:"🧸 Çok basitçe: ";font-weight:700;color:#c9b2ff}
.steps{counter-reset:st;list-style:none;padding-left:0 !important}
.steps>li{counter-increment:st;position:relative;padding:6px 8px 6px 34px;margin:5px 0;background:#272c34;border:1px solid #39404a;border-radius:7px;transition:border-color .2s,background .2s}
.steps>li::before{content:counter(st);position:absolute;left:8px;top:6px;width:19px;height:19px;border-radius:50%;background:#3a414b;color:#fff;font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center}
.steps>li.done{border-color:#3f8a52;background:#22302a}
.steps>li.done::before{content:"✓";background:#3f8a52}
.acts{display:inline-flex;gap:4px;margin-left:4px;vertical-align:middle}
.acts button{font-size:11px;padding:1px 7px;border-radius:10px;background:#1f2a36;border:1px solid #3e6189;color:#cfe4ff;cursor:pointer;transition:background .15s}
.acts button:hover{background:#2b3d52}
.acts button.do{background:#3a2a17;border-color:#9a6224;color:#ffd7a8}
.acts button.do:hover{background:#4d3720}
.live{display:inline-block;background:#111;border:1px solid #444;border-radius:5px;padding:0 6px;font:12px Consolas,monospace;color:#9fffb5;min-width:60px}
.live.bad{color:#ff9a7a}
.chk{display:inline-block;width:16px;height:16px;border-radius:50%;background:#444;color:#fff;text-align:center;font-size:11px;line-height:16px;margin-right:4px}
.chk.ok{background:#3f8a52}
#stepNav{display:flex;align-items:center;gap:6px;margin:4px 0 10px;flex-wrap:wrap}
#stepNav .dots{display:flex;gap:2px;flex-wrap:wrap;flex:1}
#stepNav .dot{min-width:20px;height:20px;padding:0 3px;border-radius:10px;font-size:9.5px !important;background:#2f353d;border:1px solid #4a525c;color:#ccc;font-size:10.5px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
#stepNav .dot.on{background:var(--accent);border-color:#ffb25c;color:#000;font-weight:700;transform:scale(1.12)}
#stepNav .dot.k-task{border-color:#c4701f;color:#ffd7a8}
#stepNav .dot.k-prep{color:#9ab}
#stepNav .dot.k-bonus{border-style:dashed}
.stepHead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 0}
.stepHead .goes{color:var(--muted);font-size:12px}
.stepHead .goes b{color:#ffd7a8}
.kind{display:inline-block;border-radius:5px;padding:1px 8px;font-size:11px;font-weight:800;letter-spacing:.5px}
.kind.task{background:#c4701f;color:#fff}
.kind.prep{background:#3a4a5e;color:#cfe4ff}
.kind.start,.kind.end{background:#3f8a52;color:#fff}
.kind.bonus{background:#57487a;color:#fff}
#stepNav .dot.ok{border-color:#3f8a52;box-shadow:0 0 0 2px #3f8a5255}
.recipe{border:1px solid #3a4048;border-radius:8px;margin:6px 0;background:#252a31;overflow:hidden}
.recipe summary{cursor:pointer;padding:7px 10px;font-weight:600;list-style:none;display:flex;gap:8px;align-items:center}
.recipe summary::-webkit-details-marker{display:none}
.recipe summary::before{content:"▸";transition:transform .2s;color:var(--accent)}
.recipe[open] summary::before{transform:rotate(90deg)}
.recipe[open] summary{background:#2c323a}
.recipe .in{padding:4px 12px 10px}
.keyrow{display:flex;gap:8px;align-items:flex-start;padding:5px 4px;border-bottom:1px solid #333a42;cursor:pointer;border-radius:4px;transition:background .15s}
.keyrow:hover{background:#2c323a}
.keyrow .kn{min-width:120px;font-weight:700;color:#fff}
.keyrow .kd{flex:1;color:#cdd3da}
.keyrow .ks{flex:none}
table.lab input{width:72px;background:#15181c;color:#fff;border:1px solid #4a525c;border-radius:4px;padding:2px 4px;font:12px Consolas,monospace}
table.lab td.th{color:#9ccfff;font-family:Consolas,monospace}
table.lab td.err{font-family:Consolas,monospace}
.good{color:var(--ok)} .bad{color:var(--warn)}
.calc{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;background:#1d2127;border:1px solid #3a4048;border-radius:8px;padding:8px 10px}
.calc input{width:90px;background:#15181c;color:#fff;border:1px solid #4a525c;border-radius:4px;padding:2px 5px}
.calc b{font-family:Consolas,monospace;color:#9fffb5;font-weight:400}
.formula{font-family:Cambria,Georgia,serif;font-size:14px;background:#15181c;border:1px solid #3a4048;border-radius:6px;padding:6px 10px;margin:6px 0;text-align:center}

header h1 .ver{color:var(--muted);font-weight:400;font-size:11px;margin-left:4px}
#updBar{position:fixed;left:50%;bottom:18px;transform:translate(-50%,140%);display:flex;gap:10px;align-items:center;background:#23282e;border:1px solid var(--accent);border-radius:10px;padding:8px 12px;box-shadow:0 6px 24px rgba(0,0,0,.6);z-index:80;transition:transform .35s var(--ease)}
#updBar.show{transform:translate(-50%,0)}
/* Devre seçici + kütüphane */
.cnav{display:inline-flex;align-items:center;gap:3px}
#curName{max-width:330px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
#modal .box.lib{max-width:1100px;width:94%}
.libHead{display:flex;justify-content:space-between;align-items:center}
.libHead h2{margin:0}
#modal .box h3{margin:16px 0 8px;font-size:14px;color:var(--accent2)}
#modal .box h3 small{color:var(--muted);font-weight:400}
.muted{color:var(--muted)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.ccard{position:relative;background:#2a2f37;border:1px solid #444c56;border-left:4px solid #6a7480;border-radius:8px;padding:8px 10px;cursor:pointer;transition:transform .12s,border-color .15s,background .15s;margin:4px 0}
.ccard:hover{transform:translateY(-2px);background:#323842;border-color:#7a8592}
.ccard.lab{border-left-color:#f0b22a}.ccard.learn{border-left-color:#4fc3ff}.ccard.test{border-left-color:#c084fc}.ccard.other{border-left-color:#888}
.ccard.cur{box-shadow:0 0 0 2px var(--accent)}
.ccard .ct{font-weight:700;font-size:13px}
.ccard .ck{color:#b9c4d0;font-size:12px;margin-top:2px}
.ccard .cf{color:var(--muted);font-size:11.5px;margin-top:3px}
.ccard .cst{position:absolute;top:6px;right:8px;font-size:10.5px;background:#3a414b;border-radius:8px;padding:0 6px;color:#ddd}
.ccard .cst.ok{background:#3f8a52;color:#fff}
.kind.test{background:#7c4dbb;color:#fff}
/* Ekran açıklama işaretleri (!) */
#infoLayer{position:absolute;pointer-events:none;z-index:5}
#infoLayer.off{display:none}
.ibadge{position:absolute;transform:translate(-50%,-50%);width:17px;height:17px;border-radius:50%;border:1.5px solid #fff;background:#f08a1c;color:#fff;font:900 11px/14px Arial;text-align:center;padding:0;cursor:pointer;pointer-events:auto;box-shadow:0 0 0 2px rgba(240,138,28,.35),0 2px 6px rgba(0,0,0,.6);opacity:.88;transition:transform .15s,opacity .15s}
.ibadge:hover{transform:translate(-50%,-50%) scale(1.25);opacity:1}
.ibadge.pulse{animation:ipulse 2.2s ease-in-out 3}
@keyframes ipulse{0%,100%{box-shadow:0 0 0 2px rgba(240,138,28,.35)}50%{box-shadow:0 0 0 7px rgba(240,138,28,.0),0 0 12px rgba(240,138,28,.9)}}
#modal .box.info{max-width:760px}
.info h2{margin:0 0 6px}
.info .row{display:grid;grid-template-columns:minmax(150px,auto) 1fr;gap:4px 12px;border-bottom:1px solid #3a4048;padding:6px 2px}
.info .row code{font:13px Consolas,monospace;color:#ffe9a8;background:#15181c;border:1px solid #3a4048;border-radius:4px;padding:1px 6px;align-self:start}
.info .row .d b{color:#fff}
.info .scr{font:13px Consolas,monospace;background:#0b0d10;border:1px solid #444;border-radius:6px;padding:8px 10px;white-space:pre;color:#e8e8e8;overflow:auto}
.ihelp{display:inline-block;width:16px;height:16px;border-radius:50%;background:#f08a1c;color:#fff;font:900 10px/16px Arial;text-align:center;cursor:pointer;margin-left:4px;vertical-align:middle}

/* Panel tuşları */
.btn{cursor:pointer}
.btn .cap{transition:transform .07s}
.btn.pressed .cap{transform:translate(0px,1.6px)}
.btn.pressed .face{filter:brightness(.82)}
.btn:hover .face{filter:brightness(1.04)}
.knob{cursor:grab}
.knob:active{cursor:grabbing}
.knob .rot{transition:transform .12s ease-out}
.knobRing{fill:none;stroke:#f08a1c;stroke-width:2.5;opacity:0;transition:opacity .25s}
.knob.active .knobRing{opacity:.95}
.hlRing{fill:none;stroke:#ff7a00;stroke-width:4;pointer-events:none;animation:hl 1s ease-in-out infinite}
@keyframes hl{0%,100%{opacity:.25;stroke-width:3}50%{opacity:1;stroke-width:6}}
.bench-comp{cursor:move}
.bench-pin{cursor:crosshair;transition:fill .12s}
.bench-pin:hover{fill:#f08a1c}
.probe-h{cursor:grab}
.netTag{pointer-events:none}

@media (max-width:1150px){
  #layout{grid-template-columns:1fr}
  #layout.noguide #guide{display:none}
  #guide{position:relative;top:0;height:auto;max-height:none}
  #benchBody{grid-template-columns:100px minmax(0,1fr)}
  #props{grid-column:1/-1}
}
</style>
</head>
<body>
<header>
  <h1><span>GW INSTEK</span> GDS-1102B · Osiloskop Simülatörü <small class="ver" title="Derleme: 2026-10-15 14:39">v1.1.0</small></h1>
  <button class="ui primary" id="libBtn" title="Tüm devreler: Lab 1, öğretmeli devreler, test devreleri">📚 Devreler</button>

<script>
"use strict";

/* =====================================================================
 * Units — SI ön ekli biçimlendirme / ayrıştırma ve 1-2-5 dizileri
 * ===================================================================== */
const Units = (() => {
  const PFX = [[1e9, 'G'], [1e6, 'M'], [1e3, 'k'], [1, ''], [1e-3, 'm'], [1e-6, 'µ'], [1e-9, 'n'], [1e-12, 'p']];

  /** v değerini 'digits' anlamlı basamakla, uygun SI ön ekiyle yazar: fmt(0.00123,'s') -> "1.23ms" */
  function fmt(v, unit = '', digits = 3) {
    if (v === null || v === undefined || !isFinite(v)) return '?';
    if (v === 0) return (0).toFixed(Math.max(0, digits - 1)) + unit;
    const r = Number(v.toPrecision(digits));          // önce yuvarla, sonra ön eki seç (0.99996k → 1.000k)
    const a = Math.abs(r);
    let p = PFX[PFX.length - 1];
    for (const q of PFX) { if (a >= q[0] * (1 - 1e-12)) { p = q; break; } }
    return (r / p[0]).toPrecision(digits) + p[1] + unit;
  }

  /** "4.7k", "10u", "100n", "2.2meg", "1µ", "50" → sayı. Başarısızsa NaN. */
  function parse(str) {
    if (typeof str === 'number') return str;
    const s = String(str).trim().replace(',', '.');
    const m = s.match(/^([-+]?(?:\d+\.?\d*|\.\d+)(?:e[-+]?\d+)?)\s*(meg|[GMkKmuµnp])?/i);
    if (!m) return NaN;
    let v = parseFloat(m[1]);
    const p = m[2];
    if (p) {
      const map = { G: 1e9, M: 1e6, k: 1e3, K: 1e3, m: 1e-3, u: 1e-6, 'µ': 1e-6, n: 1e-9, p: 1e-12 };
      v *= /^meg$/i.test(p) ? 1e6 : map[p];
    }
    return v;
  }

  /** [lo, hi] aralığında 1-2-5 dizisi */
  function seq125(lo, hi) {
    const out = [];
    for (let e = -12; e <= 4; e++) for (const m of [1, 2, 5]) {
      const v = +(m * Math.pow(10, e)).toPrecision(3);
      if (v >= lo * 0.999 && v <= hi * 1.001) out.push(v);
    }
    return out;
  }
  return { fmt, parse, seq125 };
})();

/* =====================================================================
 * MNA — Modified Nodal Analysis ile zaman alanı (transient) çözücü
 *   - Kapasitör/bobin: trapez (varsayılan) veya Backward-Euler companion modeli
 *   - Gerilim kaynakları: Norton eşdeğeri (V/R akım kaynağı + 1/R iletkenlik)
 *   - Diyot: Shockley modeli, Newton-Raphson + pnjlim gerilim sınırlaması
 *   - İdeal op-amp: yüksek kazançlı VCVS (A=1e5, Ro=1Ω), Norton biçiminde
 *   Düğüm 0 = toprak. Matris yoğun (dense), kısmi pivotlu LU.
 * ===================================================================== */
const MNA = (() => {
  const VT = 0.025852;           // 300 K termal gerilim
  const GMIN = 1e-12;            // her düğümden toprağa küçük iletkenlik (tekil matrisi önler)

  /** Yerinde LU ayrıştırma (kısmi pivotlama). A: Float64Array n*n. */
  function luFactor(A, n, piv) {
    for (let i = 0; i < n; i++) piv[i] = i;
    for (let k = 0; k < n; k++) {
      let p = k, max = Math.abs(A[k * n + k]);
      for (let i = k + 1; i < n; i++) { const v = Math.abs(A[i * n + k]); if (v > max) { max = v; p = i; } }
      if (max < 1e-300) { A[k * n + k] = 1e-18; }
      if (p !== k) {
        for (let j = 0; j < n; j++) { const t = A[k * n + j]; A[k * n + j] = A[p * n + j]; A[p * n + j] = t; }
        const t = piv[k]; piv[k] = piv[p]; piv[p] = t;
      }
      const d = A[k * n + k];
      for (let i = k + 1; i < n; i++) {
        const f = (A[i * n + k] /= d);
        if (f !== 0) for (let j = k + 1; j < n; j++) A[i * n + j] -= f * A[k * n + j];
      }
    }
  }
  function luSolve(A, n, piv, b, x) {
    for (let i = 0; i < n; i++) x[i] = b[piv[i]];
    for (let i = 0; i < n; i++) { let s = x[i]; for (let j = 0; j < i; j++) s -= A[i * n + j] * x[j]; x[i] = s; }
    for (let i = n - 1; i >= 0; i--) { let s = x[i]; for (let j = i + 1; j < n; j++) s -= A[i * n + j] * x[j]; x[i] = s / A[i * n + i]; }
  }
  function pnjlim(vnew, vold, vt, vcrit) {
    if (vnew > vcrit && Math.abs(vnew - vold) > 2 * vt) {
      if (vold > 0) { const arg = 1 + (vnew - vold) / vt; vnew = arg > 0 ? vold + vt * Math.log(arg) : vcrit; }
      else vnew = vt * Math.log(vnew / vt);
    }
    return vnew;
  }

  /**
   * Devre. elems:
   *  {t:'R', a, b, R}  {t:'C', a, b, C}  {t:'L', a, b, L}
   *  {t:'D', a, b(katot), Is, N}
   *  {t:'V', a(+), b(-), R, fn:(t)=>volt}   (Norton; R>0)
   *  {t:'OA', p, n, o, A, Ro}
   */
  class Circuit {
    constructor(nNodes, elems) {
      this.nn = nNodes;                 // toprak dahil düğüm sayısı
      this.n = Math.max(1, nNodes - 1); // bilinmeyen sayısı
      this.el = elems;
      this.nonlin = elems.some(e => e.t === 'D');
      this.v = new Float64Array(nNodes);       // düğüm gerilimleri (v[0]=0)
      const n = this.n;
      this.Gw = new Float64Array(n * n);       // NR çalışma kopyası
      this.piv = new Int32Array(n);
      this.b = new Float64Array(n);
      this.x = new Float64Array(n);
      this.dt = -1; this.forceBE = 0;
      this.t = 0;
      this.first = true;                 // ilk adım Backward-Euler (trapez başlangıç geçmişi yok)
      for (const e of elems) {
        if (e.t === 'C') { e.vp = 0; e.ip = 0; }
        if (e.t === 'L') { e.vp = 0; e.ip = 0; }
        if (e.t === 'D') { e.vd = 0; e.vcrit = e.N * VT * Math.log(e.N * VT / (Math.SQRT2 * e.Is)); }
      }
    }
    _stampG(G, a, b, g) {
      const n = this.n;
      if (a > 0) G[(a - 1) * n + (a - 1)] += g;
      if (b > 0) G[(b - 1) * n + (b - 1)] += g;
      if (a > 0 && b > 0) { G[(a - 1) * n + (b - 1)] -= g; G[(b - 1) * n + (a - 1)] -= g; }
    }
    _rhs(i, val) { if (i > 0) this.b[i - 1] += val; }
    /** dt değişince doğrusal taban matrislerini (TR ve BE için ayrı) yeniden kur; doğrusal devrede LU'yu önbelleğe al. */
    _build(dt) {
      const n = this.n;
      this.base = {};
      for (const be of [false, true]) {
        const G = new Float64Array(n * n);
        for (let i = 0; i < n; i++) G[i * n + i] += GMIN;
        for (const e of this.el) {
          switch (e.t) {
            case 'R': this._stampG(G, e.a, e.b, 1 / e.R); break;
            case 'C': { const g = (be ? 1 : 2) * e.C / dt; if (be) e.gBE = g; else e.gTR = g; this._stampG(G, e.a, e.b, g); break; }
            case 'L': { const g = (be ? 1 : 0.5) * dt / e.L; if (be) e.gBE = g; else e.gTR = g; this._stampG(G, e.a, e.b, g); break; }
            case 'V': this._stampG(G, e.a, e.b, 1 / e.R); break;
            case 'OA': {
              const g = 1 / e.Ro, ga = e.A / e.Ro, o = e.o - 1;
              if (e.o > 0) {
                G[o * n + o] += g;
                if (e.p > 0) G[o * n + (e.p - 1)] -= ga;
                if (e.n > 0) G[o * n + (e.n - 1)] += ga;
              }
              break;
            }
          }
        }
        const rec = { G, LU: null, piv: null };
        if (!this.nonlin) { rec.LU = G.slice(); rec.piv = new Int32Array(n); luFactor(rec.LU, n, rec.piv); }
        this.base[be ? 'BE' : 'TR'] = rec;
      }
      this.dt = dt;
    }
    /**
     * Bir zaman adımı ilerlet.
     * method: 'TR' (trapez) | 'BE' (backward Euler).
     * Trapez, kare dalga kenarı gibi süreksizliklerde sayısal salınım (ringing) yapabildiğinden
     * kaynaklardan biri bu adımda kenar üretiyorsa (e.edge) veya ilk adımsa o adım BE ile çözülür
     * (SPICE'taki "breakpoint" davranışına benzer).
     */
    step(dt, method = 'TR') {
      if (dt !== this.dt) this._build(dt);
      const t0 = this.t, t1 = t0 + dt;
      let be = this.first || method === 'BE' || this.forceBE > 0;
      if (!be) for (const e of this.el) if (e.t === 'V' && e.edge && e.edge(t0, t1)) { be = true; this.forceBE = 2; break; }
      if (this.forceBE > 0 && !this.first) this.forceBE--;
      const M = this.base[be ? 'BE' : 'TR'];
      const b = this.b, v = this.v, n = this.n;
      b.fill(0);
      for (const e of this.el) {
        switch (e.t) {
          case 'C': { e.geq = be ? e.gBE : e.gTR; const J = be ? e.geq * e.vp : e.geq * e.vp + e.ip; this._rhs(e.a, J); this._rhs(e.b, -J); e.J = J; break; }
          case 'L': { e.geq = be ? e.gBE : e.gTR; const K = be ? e.ip : e.ip + e.geq * e.vp; this._rhs(e.a, -K); this._rhs(e.b, K); e.K = K; break; }
          case 'V': { const I = e.fn(t1, dt) / e.R; this._rhs(e.a, I); this._rhs(e.b, -I); break; }
        }
      }
      if (!this.nonlin) {
        luSolve(M.LU, n, M.piv, b, this.x);
      } else {
        // Newton-Raphson: diyotlar her iterasyonda (gd, ieq) ile doğrusallaştırılır
        const bl = b.slice();
        const diodes = this.diodes || (this.diodes = this.el.filter(e => e.t === 'D'));
        let ok = false;
        for (let it = 0; it < 80; it++) {
          this.Gw.set(M.G); b.set(bl);
          for (const d of diodes) {
            const nvt = d.N * VT;
            const ex = Math.exp(Math.min(d.vd / nvt, 80));
            const id = d.Is * (ex - 1), gd = d.Is * ex / nvt + GMIN;
            const ieq = id - gd * d.vd;
            this._stampG(this.Gw, d.a, d.b, gd);
            this._rhs(d.a, -ieq); this._rhs(d.b, ieq);
          }
          luFactor(this.Gw, n, this.piv);
          luSolve(this.Gw, n, this.piv, b, this.x);
          let conv = true;
          for (const d of diodes) {
            const va = d.a > 0 ? this.x[d.a - 1] : 0, vk = d.b > 0 ? this.x[d.b - 1] : 0;
            const vn = va - vk;
            const lim = pnjlim(vn, d.vd, d.N * VT, d.vcrit);
            if (Math.abs(lim - d.vd) > 1e-9 + 1e-6 * Math.abs(d.vd) || lim !== vn) conv = false;
            d.vd = lim;
          }
          if (conv && it > 0) { ok = true; break; }
        }
        this.nrFail = !ok;
      }
      // çözümü düğüm dizisine yaz, reaktif elemanların durumlarını güncelle
      v[0] = 0;
      for (let i = 1; i < this.nn; i++) v[i] = this.x[i - 1];
      for (const e of this.el) {
        if (e.t === 'C') { const vv = v[e.a] - v[e.b]; e.ip = e.geq * vv - e.J; e.vp = vv; }
        else if (e.t === 'L') { const vv = v[e.a] - v[e.b]; e.ip = e.geq * vv + e.K; e.vp = vv; }
      }
      this.t = t1;
      this.first = false;
    }
  }
  return { Circuit, luFactor, luSolve };
})();

/* =====================================================================
 * Bench — devre tezgâhının veri modeli, netlist üretimi ve hazır devreler
 *   (Arayüz/çizim BenchUI modülündedir; bu modül DOM'a dokunmaz.)
 * ===================================================================== */
const Bench = (() => {
  /** Bileşen tipleri: yerel pin koordinatları (döndürmeden önce) ve varsayılan değerler */
  const TYPES = {
    R:    { name: 'Direnç',        pins: [[-40, 0], [40, 0]], def: { value: 1000 }, unit: 'Ω', ref: 'R' },
    C:    { name: 'Kondansatör',   pins: [[-40, 0], [40, 0]], def: { value: 1e-6 }, unit: 'F', ref: 'C' },
    L:    { name: 'Bobin',         pins: [[-40, 0], [40, 0]], def: { value: 10e-3 }, unit: 'H', ref: 'L' },
    D:    { name: 'Diyot (1N4148)', pins: [[-40, 0], [40, 0]], def: { Is: 2.52e-9, N: 1.752 }, pinNames: ['A', 'K'], ref: 'D' },
    FG:   { name: 'Fonksiyon jeneratörü', pins: [[0, -40], [0, 40]], def: { wave: 'sine', freq: 1000, vpp: 2, offset: 0, rout: 50 }, pinNames: ['+', '−'], ref: 'FG' },
    DC:   { name: 'DC güç kaynağı', pins: [[0, -40], [0, 40]], def: { value: 5 }, unit: 'V', pinNames: ['+', '−'], ref: 'V' },
    GND:  { name: 'Toprak',        pins: [[0, -20]], def: {} },
    OA:   { name: 'İdeal op-amp',  pins: [[-40, -20], [-40, 20], [40, 0]], def: {}, pinNames: ['−', '+', 'out'], ref: 'U' },
    COMP: { name: 'Prob kompanzasyon çıkışı', pins: [[40, -20], [40, 20]], def: {}, pinNames: ['⊓ 2V', '⏚'], fixed: true },
  };

  const model = {
    comps: [], wires: [], nextId: 1,
    // İki prob: uç (tip) ve timsah toprak klipsi (gnd) ayrı ayrı bir pine takılır. x10: probun üstündeki fiziksel anahtar
    probes: [
      { ch: 0, tip: null, gnd: null, tipXY: [820, 120], gndXY: [860, 170], x10: true },
      { ch: 1, tip: null, gnd: null, tipXY: [820, 260], gndXY: [860, 310], x10: true },
    ],
    ext: { tip: null, tipXY: [820, 400] },
    netNames: {},         // 'bileşen:pin' → düğüm adı (ör. Vi, A, Vo); tezgâhta etiket olarak çizilir
    version: 0,           // her değişiklikte artar (Sim yeniden kurulumu için)
  };

  function rotPt(x, y, rot) {
    for (let i = 0; i < (rot & 3); i++) { const t = x; x = -y; y = t; }
    return [x, y];
  }
  function pinPos(c, i) {
    const [px, py] = TYPES[c.type].pins[i];
    const [rx, ry] = rotPt(px, py, c.rot || 0);
    return [c.x + rx, c.y + ry];
  }
  function byId(id) { return model.comps.find(c => c.id === id); }

  /** Yeni bileşen için sıradaki boş etiket: R1, R2, C1 … */
  function nextName(type) {
    const pre = TYPES[type].ref; if (!pre) return '';
    for (let k = 1; ; k++) if (!model.comps.some(c => c.name === pre + k)) return pre + k;
  }
  function add(type, x, y, rot = 0, params = {}) {
    const c = { id: model.nextId++, type, x, y, rot, name: nextName(type), ...JSON.parse(JSON.stringify(TYPES[type].def)), ...params };
    model.comps.push(c); changed(); return c;
  }
  function remove(id) {
    const c = byId(id); if (!c || TYPES[c.type].fixed) return;
    model.comps = model.comps.filter(k => k.id !== id);
    model.wires = model.wires.filter(w => w.a.c !== id && w.b.c !== id);
    for (const p of [...model.probes, model.ext]) {
      if (p.tip && p.tip.c === id) p.tip = null;
      if (p.gnd && p.gnd.c === id) p.gnd = null;
    }
    for (const k in model.netNames) if (+k.split(':')[0] === id) delete model.netNames[k];
    changed();
  }
  function connect(a, b) {
    if (a.c === b.c && a.p === b.p) return;
    if (model.wires.some(w => (same(w.a, a) && same(w.b, b)) || (same(w.a, b) && same(w.b, a)))) return;
    model.wires.push({ a, b }); changed();
  }
  const same = (u, v) => u && v && u.c === v.c && u.p === v.p;
  function changed() { model.version++; }

  /**
   * Kaynak dalga fonksiyonu fn(t, dt) (volt).
   * Kare dalga, adım aralığı [t−dt/2, t+dt/2] üzerinde ortalanarak verilir (kutu filtresi):
   * böylece kenar, çözücü adımının neresine düşerse düşsün doğru zamanda görünür (frekans ölçümü kayık çıkmaz).
   */
  const sqInt = (t, f) => { const u = t * f, p = u - Math.floor(u); return (p < 0.5 ? p : 1 - p) / f; }; // ∫ kare(±1) dt
  function squareAvg(t, dt, f) {
    if (!dt) { const u = t * f; return (u - Math.floor(u)) < 0.5 ? 1 : -1; }
    return (sqInt(t + dt / 2, f) - sqInt(t - dt / 2, f)) / dt;
  }
  function waveFn(c) {
    return (t, dt) => {
      const A = c.vpp / 2, f = c.freq;
      const ph = t * f - Math.floor(t * f);
      switch (c.wave) {
        case 'square': return c.offset + A * squareAvg(t, dt, f);
        case 'triangle': return c.offset + A * (ph < 0.5 ? 4 * ph - 1 : 3 - 4 * ph);
        default: return c.offset + A * Math.sin(2 * Math.PI * ph);
      }
    };
  }
  const squareEdge = (fget) => (t0, t1) => Math.floor(2 * t0 * fget()) !== Math.floor(2 * t1 * fget());

  /**
   * Netlist üretimi. Pin bağlantılarını (kablolar) union-find ile düğümlere indirger.
   * Dönüş: { nNodes, elems, probeNode:[n1,n2], extNode, warnings[], freqs[], gndShort[] }
   * opts.compFreq: prob kompanzasyon frekansı (Utility menüsünden)
   */
  function netlist(opts) {
    const parent = new Map();
    const key = (c, p) => c + ':' + p;
    const find = (k) => { while (parent.get(k) !== k) { parent.set(k, parent.get(parent.get(k))); k = parent.get(k); } return k; };
    const union = (a, b) => { a = find(a); b = find(b); if (a !== b) parent.set(a, b); };
    parent.set('GND', 'GND');
    for (const c of model.comps) TYPES[c.type].pins.forEach((_, i) => parent.set(key(c.id, i), key(c.id, i)));
    for (const w of model.wires) if (parent.has(key(w.a.c, w.a.p)) && parent.has(key(w.b.c, w.b.p))) union(key(w.a.c, w.a.p), key(w.b.c, w.b.p));
    for (const c of model.comps) {
      if (c.type === 'GND') union(key(c.id, 0), 'GND');
      if (c.type === 'COMP') union(key(c.id, 1), 'GND');   // kompanzasyon çıkışının toprak terminali = şase
    }
    // Düğüm numaraları: toprak = 0
    const idx = new Map(); idx.set(find('GND'), 0);
    let nn = 1;
    const node = (c, p) => { const r = find(key(c, p)); if (!idx.has(r)) idx.set(r, nn++); return idx.get(r); };
    for (const c of model.comps) TYPES[c.type].pins.forEach((_, i) => node(c.id, i));

    const elems = [], warnings = [], freqs = [], sqFreqs = [], gndShort = [];
    for (const c of model.comps) {
      const n = (i) => node(c.id, i);
      switch (c.type) {
        case 'R': elems.push({ t: 'R', a: n(0), b: n(1), R: Math.max(c.value, 1e-3) }); break;
        case 'C': elems.push({ t: 'C', a: n(0), b: n(1), C: Math.max(c.value, 1e-15) }); break;
        case 'L': elems.push({ t: 'L', a: n(0), b: n(1), L: Math.max(c.value, 1e-12) }); break;
        case 'D': elems.push({ t: 'D', a: n(0), b: n(1), Is: c.Is, N: c.N }); break;
        case 'FG': {
          const e = { t: 'V', a: n(0), b: n(1), R: Math.max(c.rout, 1e-3), fn: waveFn(c), ac: 1 };   // ac: AC analizinde 1 V kaynak
          if (c.wave === 'square') { e.edge = squareEdge(() => c.freq); sqFreqs.push(c.freq); }
          elems.push(e); freqs.push(c.freq); break;
        }
        case 'DC': elems.push({ t: 'V', a: n(0), b: n(1), R: 0.01, fn: () => c.value }); break; // TAHMIN: 10 mΩ iç direnç
        case 'OA': elems.push({ t: 'OA', n: n(0), p: n(1), o: n(2), A: 1e5, Ro: 1 }); break;
        case 'COMP': {
          // Prob kompanzasyon çıkışı: 0 V / 2 V kare dalga, 1 kHz (Utility > Probe Comp ile değişir)
          const f = () => opts.compFreq;
          elems.push({ t: 'V', a: n(0), b: 0, R: 1000,   // TAHMIN: ~1 kΩ çıkış direnci
            fn: (t, dt) => 1 + squareAvg(t, dt, f()), edge: squareEdge(f) });
          // bağlı değilse adım seçimini etkilemesin
          const used = model.wires.some(w => (w.a.c === c.id && w.a.p === 0) || (w.b.c === c.id && w.b.p === 0)) ||
                       [...model.probes, model.ext].some(p => p.tip && p.tip.c === c.id && p.tip.p === 0);
          if (used) { freqs.push(opts.compFreq); sqFreqs.push(opts.compFreq); }
          break;
        }
      }
    }
    // Prob yüklemesi ve toprak klipsi
    const probeNode = [-1, -1];
    for (const p of model.probes) {
      if (p.tip && byId(p.tip.c)) {
        const nd = node(p.tip.c, p.tip.p);
        probeNode[p.ch] = nd;
        if (nd > 0) elems.push({ t: 'R', a: nd, b: 0, R: p.x10 ? 10e6 : 1e6 }); // ×10: 10 MΩ, ×1: 1 MΩ (osiloskop girişi)
      }
      if (p.gnd && byId(p.gnd.c)) {
        const nd = node(p.gnd.c, p.gnd.p);
        if (nd > 0) {
          // Osiloskobun toprağı şebeke toprağına bağlıdır: klips o noktayı toprağa kısa devre eder.
          elems.push({ t: 'R', a: nd, b: 0, R: 0.05 });
          gndShort.push(p.ch);
          warnings.push(`CH${p.ch + 1} probunun toprak klipsi topraktan farklı bir noktaya bağlı! Gerçekte bu nokta osiloskop şasesi üzerinden toprağa kısa devre olur (ground loop). Simülasyonda da kısa devre edildi.`);
        }
      }
    }
    let extNode = -1;
    if (model.ext.tip && byId(model.ext.tip.c)) {
      extNode = node(model.ext.tip.c, model.ext.tip.p);
      if (extNode > 0) elems.push({ t: 'R', a: extNode, b: 0, R: 1e6 });
    }
    if (model.probes.some(p => p.tip && p.gnd && p.tip.c === p.gnd.c && p.tip.p === p.gnd.p)) { /* uç ve klips aynı yerde: 0 V okur */ }
    return { nNodes: nn, elems, probeNode, extNode, warnings, freqs, sqFreqs, gndShort, pin: (c, p) => node(c, p) };
  }

  /**
   * Düğüm listesi (hızlı prob bağlama ve ipuçları için).
   * Dönüş: [{ key, pins:[{c,p}], gnd, name, desc }] — toprak düğümü ilk sırada.
   */
  function nodes() {
    const parent = new Map();
    const key = (c, p) => c + ':' + p;
    const find = (k) => { while (parent.get(k) !== k) k = parent.get(k); return k; };
    const union = (a, b) => { a = find(a); b = find(b); if (a !== b) parent.set(a, b); };
    parent.set('GND', 'GND');
    for (const c of model.comps) TYPES[c.type].pins.forEach((_, i) => parent.set(key(c.id, i), key(c.id, i)));
    for (const w of model.wires) if (parent.has(key(w.a.c, w.a.p)) && parent.has(key(w.b.c, w.b.p))) union(key(w.a.c, w.a.p), key(w.b.c, w.b.p));
    for (const c of model.comps) { if (c.type === 'GND') union(key(c.id, 0), 'GND'); if (c.type === 'COMP') union(key(c.id, 1), 'GND'); }
    const groups = new Map();
    const gk = find('GND');
    for (const c of model.comps) TYPES[c.type].pins.forEach((_, i) => {
      const r = find(key(c.id, i));
      if (!groups.has(r)) groups.set(r, { key: r, pins: [], gnd: r === gk });
      groups.get(r).pins.push({ c: c.id, p: i });
    });
    let k = 1;
    const out = [...groups.values()].sort((a, b) => b.gnd - a.gnd);
    for (const g of out) {
      const named = g.pins.map(r => model.netNames[key(r.c, r.p)]).find(Boolean);
      g.name = named || (g.gnd ? 'GND' : 'N' + k++);
      const real = g.pins.filter(r => { const c = byId(r.c); return c && c.type !== 'GND'; });
      g.desc = g.gnd ? 'toprak' + (real.length ? ' · ' + real.map(pinLabel).join(', ') : '') : real.map(pinLabel).join(', ');
    }
    return out;
  }
  /** "R1.2", "FG1 +" gibi okunur pin adı */
  function pinLabel(r) {
    const c = byId(r.c); if (!c) return '?';
    const t = TYPES[c.type];
    const nm = c.name || (c.type === 'GND' ? 'Toprak' : c.type === 'COMP' ? 'PROBE COMP' : c.type);
    if (t.pinNames) return nm + ' ' + t.pinNames[r.p];
    if (t.pins.length === 2) return nm + '.' + (r.p + 1);
    return nm;
  }
  /** Bir pinin bağlı olduğu düğüm (nodes() elemanı) */
  function nodeOf(r, list = nodes()) {
    if (!r) return null;
    return list.find(g => g.pins.some(q => q.c === r.c && q.p === r.p)) || null;
  }

  /* ---------- Geri al / yinele için anlık görüntü ---------- */
  function snapshot() {
    return JSON.stringify({ comps: model.comps, wires: model.wires, probes: model.probes, ext: model.ext, nextId: model.nextId, netNames: model.netNames });
  }
  function restore(json) {
    const o = JSON.parse(json);
    model.comps = o.comps; model.wires = o.wires; model.nextId = o.nextId; model.netNames = o.netNames || {};
    o.probes.forEach((p, i) => Object.assign(model.probes[i], p));
    Object.assign(model.ext, o.ext);
    changed();
  }

  /* ---------- Hazır devreler ---------- */
  function clear() {
    model.comps = []; model.wires = []; model.netNames = {};
    for (const p of model.probes) { p.tip = null; p.gnd = null; }
    model.ext.tip = null;
    changed();
  }
  const W = (a, pa, b, pb) => connect({ c: a.id, p: pa }, { c: b.id, p: pb });

  function preset(name) {
    clear();
    const comp = add('COMP', 70, 400);
    const P = model.probes;
    P[0].x10 = true; P[1].x10 = true;
    const att = (pr, c, p, gc, gp) => { pr.tip = { c: c.id, p }; pr.gnd = gc ? { c: gc.id, p: gp } : null; };
    switch (name) {
      case 'wien': {
        // EE212 Lab 1 (Şekil 1): Vi → R1 (1 kΩ) → C1 (1 µF) → Vo ; Vo düğümünden toprağa C2 (1 µF) ∥ R2 (1 kΩ)
        // Kaynak: 50 Hz, 4 Vpp sinüs. CH1 = Vi (kaynak), CH2 = Vo (R2 üzerindeki gerilim)
        const fg = add('FG', 140, 230, 0, { wave: 'sine', freq: 50, vpp: 4, offset: 0 });
        const g1 = add('GND', 140, 360);
        const r1 = add('R', 300, 110, 0, { value: 1000 });
        const c1 = add('C', 460, 110, 0, { value: 1e-6 });
        const c2 = add('C', 600, 230, 1, { value: 1e-6 });
        const r2 = add('R', 740, 230, 1, { value: 1000 });
        const g2 = add('GND', 600, 360), g3 = add('GND', 740, 360);
        W(r1, 0, fg, 0); W(fg, 1, g1, 0); W(r1, 1, c1, 0); W(c1, 1, c2, 0); W(c1, 1, r2, 0);
        W(c2, 1, g2, 0); W(r2, 1, g3, 0);
        model.netNames[r1.id + ':0'] = 'Vi'; model.netNames[r1.id + ':1'] = 'A'; model.netNames[r2.id + ':0'] = 'Vo';
        att(P[0], r1, 0, g1, 0); att(P[1], r2, 0, g3, 0);
        break;
      }
      case 'comp':
        att(P[0], comp, 0, comp, 1);
        P[1].tipXY = [820, 260]; P[1].gndXY = [860, 310];
        break;
      case 'rc': {
        // 1 kΩ / 1 µF, 4 Vpp sinüs, f = 1/(2πRC) ≈ 159.15 Hz
        const fg = add('FG', 200, 200, 0, { wave: 'sine', freq: 159.15, vpp: 4, offset: 0 });
        const g1 = add('GND', 200, 300), r = add('R', 340, 120, 0, { value: 1000 });
        const c = add('C', 480, 200, 1, { value: 1e-6 }), g2 = add('GND', 480, 300);
        W(fg, 1, g1, 0); W(fg, 0, r, 0); W(r, 1, c, 0); W(c, 1, g2, 0);
        att(P[0], r, 0, g1, 0); att(P[1], c, 0, g2, 0);
        break;
      }
      case 'rlc': {
        // Seri RLC: 100 Ω, 10 mH, 1 µF → f0 = 1/(2π√LC) ≈ 1591.5 Hz. CH2 direnç üzerinde (akımla orantılı)
        const fg = add('FG', 180, 220, 0, { wave: 'sine', freq: 1591.5, vpp: 4, offset: 0 });
        const g1 = add('GND', 180, 320);
        const l = add('L', 300, 140, 0, { value: 10e-3 });
        const c = add('C', 440, 140, 0, { value: 1e-6 });
        const r = add('R', 560, 220, 1, { value: 100 });
        const g2 = add('GND', 560, 320);
        W(fg, 1, g1, 0); W(fg, 0, l, 0); W(l, 1, c, 0); W(c, 1, r, 0); W(r, 1, g2, 0);
        att(P[0], l, 0, g1, 0); att(P[1], r, 0, g2, 0);
        break;
      }
      case 'rect': {
        // Yarım dalga doğrultucu: 10 Vpp 50 Hz → 1N4148 → 1 kΩ ∥ 10 µF
        const fg = add('FG', 180, 220, 0, { wave: 'sine', freq: 50, vpp: 10, offset: 0 });
        const g1 = add('GND', 180, 320);
        const d = add('D', 320, 140, 0);
        const c = add('C', 460, 220, 1, { value: 10e-6 }), r = add('R', 580, 220, 1, { value: 1000 });
        const g2 = add('GND', 460, 320), g3 = add('GND', 580, 320);
        W(fg, 1, g1, 0); W(fg, 0, d, 0); W(d, 1, c, 0); W(c, 0, r, 0); W(c, 1, g2, 0); W(r, 1, g3, 0);
        att(P[0], d, 0, g1, 0); att(P[1], c, 0, g2, 0);
        break;
      }
      case 'empty': default: break;
    }
    changed();
  }

  return { TYPES, model, pinPos, rotPt, byId, add, remove, connect, changed, netlist, preset, clear, nodes, nodeOf, pinLabel, snapshot, restore };
})();

/* =====================================================================
 * Circuits — Lab 1'e benzer devre kütüphanesi + AC (fazör) analiz

  };

  /* ---------------- devre tanımları ---------------- */
  const L = (def) => def;   // okunurluk
  const wien = (R1, C1, R2, C2) => ({ type: 'wien', ladder: [{ ser: E('R', R1) }, { ser: E('C', C1) }, { sh: E('C', C2) }, { sh: E('R', R2) }], labels: ['Vi', 'A', 'Vo'], sense: 'R1' });

  const lr_lp = (Lv, R) => ({ type: 'lr_lp', ladder: [{ ser: E('L', Lv) }, { sh: E('R', R) }], labels: ['Vi', 'Vo'], sense: 'R1' });

    L({ id: 't16', group: 'test', title: 'Test 16 — −45° frekansını bul', f: 1000, vpp: 4, sweep: [100, 300, 600, 1000, 2000, 5000, 10000], ...rc_lp(3300, 47e-9) }),
  ];
  const get = (id) => DEFS.find(d => d.id === id);
  const info = (d) => TYPES[d.type];

  /* ---------------- tezgâha çizim ---------------- */
  const RAIL = 110, GNDY = 360;
  function build(id) {
    const d = get(id); if (!d) return false;
    if (d.preset) { B.preset(d.preset); return true; }
    B.clear();
    B.add('COMP', 70, 400);
    const P = B.model.probes;
    P[0].x10 = P[1].x10 = true;
    const fg = B.add('FG', 140, 230, 0, { wave: 'sine', freq: d.f, vpp: d.vpp, offset: 0 });
    const g0 = B.add('GND', 140, GNDY);
    B.connect({ c: fg.id, p: 1 }, { c: g0.id, p: 0 });
    if (d.custom === 'twint') return buildTwinT(d, fg, g0);
    const add = (e, x, y, rot) => B.add(e.t, x, y, rot, e.name ? { value: e.v, name: e.name } : { value: e.v });
    const W = (a, pa, b, pb) => B.connect({ c: a.id, p: pa }, { c: b.id, p: pb });
    let x = 240, node = { c: fg.id, p: 0 }, first = true, k = 0;
    let lastShunt = null;
    const label = (ref) => { const nm = d.labels[k]; if (nm) B.model.netNames[ref.c + ':' + ref.p] = nm; };
    for (const it of d.ladder) {
      if (it.ser) {
        if (it.ser.par) {
          const a = add(it.ser.par[0], x + 40, RAIL, 0), b = add(it.ser.par[1], x + 40, RAIL - 60, 0);
          W(a, 0, b, 0); W(a, 1, b, 1);
          if (first) { W(a, 0, fg, 0); label({ c: a.id, p: 0 }); } else W(B.byId(node.c), node.p, a, 0);
          node = { c: a.id, p: 1 };
        } else {
          const a = add(it.ser, x + 40, RAIL, 0);
          if (first) { W(a, 0, fg, 0); label({ c: a.id, p: 0 }); } else W(B.byId(node.c), node.p, a, 0);
          node = { c: a.id, p: 1 };
        }
        first = false; k++; label(node); x += 120;
      } else if (it.sh) {
        const xb = x;
        const chain = Array.isArray(it.sh) ? it.sh : [it.sh];
        let top, bot;
        if (chain.length === 1) { top = bot = add(chain[0], xb, 230, 1); }
        else { top = add(chain[0], xb, 230, 1); bot = add(chain[1], xb, 330, 1); W(top, 1, bot, 0); }
        W(B.byId(node.c), node.p, top, 0);
        const g = B.add('GND', xb, GNDY + (chain.length > 1 ? 40 : 0));
        W(bot, 1, g, 0);
        lastShunt = { top, g };
        x += 80;
      }
    }
    // problar: CH1 = Vi (ilk elemanın sol ucu), CH2 = Vo (son paralel kolun üstü)
    const viRef = Object.keys(B.model.netNames).find(k2 => B.model.netNames[k2] === 'Vi').split(':').map(Number);
    P[0].tip = { c: viRef[0], p: viRef[1] }; P[0].gnd = { c: g0.id, p: 0 };
    P[1].tip = { c: lastShunt.top.id, p: 0 }; P[1].gnd = { c: lastShunt.g.id, p: 0 };
    B.changed();
    return true;
  }
  function buildTwinT(d, fg, g0) {
    const v = d.vals, P = B.model.probes;
    const W = (a, pa, b, pb) => B.connect({ c: a.id, p: pa }, { c: b.id, p: pb });
    const rs = B.add('R', 240, 110, 0, { value: v.Rs, name: 'Rs' });
    const r1 = B.add('R', 360, 110, 0, { value: v.R, name: 'R1' });
    const r2 = B.add('R', 480, 110, 0, { value: v.R, name: 'R2' });
    const c3 = B.add('C', 420, 190, 1, { value: v.C3, name: 'C3' });
    const g3 = B.add('GND', 420, 260);
    const c1 = B.add('C', 340, 300, 0, { value: v.C, name: 'C1' });
    const c2 = B.add('C', 500, 300, 0, { value: v.C, name: 'C2' });
    const r3 = B.add('R', 420, 360, 1, { value: v.R3, name: 'R3' });
    const g4 = B.add('GND', 420, 430);
    W(rs, 0, fg, 0); W(rs, 1, r1, 0); W(r1, 1, r2, 0); W(r1, 1, c3, 0); W(c3, 1, g3, 0);
    W(rs, 1, c1, 0); W(c1, 1, c2, 0); W(c1, 1, r3, 0); W(r3, 1, g4, 0); W(r2, 1, c2, 1);
    Object.assign(B.model.netNames, { [rs.id + ':0']: 'Vi', [rs.id + ':1']: 'A', [r2.id + ':1']: 'Vo' });
    P[0].tip = { c: rs.id, p: 0 }; P[0].gnd = { c: g0.id, p: 0 };
    P[1].tip = { c: r2.id, p: 1 }; P[1].gnd = { c: g3.id, p: 0 };
    B.changed();
    return true;
  }

  /* ---------------- AC (fazör) analiz ---------------- */
  // Karmaşık doğrusal sistem: tezgâhtaki netlist'ten, FG = 1∠0° V, diğer kaynaklar 0
  function acSolve(f) {
    const net = B.netlist({ compFreq: 1000 });
    const n = net.nNodes - 1; if (n < 1) return null;
    const w = 2 * Math.PI * f;
    const ar = new Float64Array(n * n), ai = new Float64Array(n * n), br = new Float64Array(n), bi = new Float64Array(n);
    const st = (a, b, gr, gi) => {
      if (a > 0) { ar[(a - 1) * n + a - 1] += gr; ai[(a - 1) * n + a - 1] += gi; }
      if (b > 0) { ar[(b - 1) * n + b - 1] += gr; ai[(b - 1) * n + b - 1] += gi; }
      if (a > 0 && b > 0) { ar[(a - 1) * n + b - 1] -= gr; ai[(a - 1) * n + b - 1] -= gi; ar[(b - 1) * n + a - 1] -= gr; ai[(b - 1) * n + a - 1] -= gi; }
    };
    for (let i = 0; i < n; i++) ar[i * n + i] += 1e-12;
    for (const e of net.elems) {
      switch (e.t) {
        case 'R': st(e.a, e.b, 1 / e.R, 0); break;
        case 'C': st(e.a, e.b, 0, w * e.C); break;
        case 'L': st(e.a, e.b, 0, -1 / (w * e.L)); break;
        case 'D': st(e.a, e.b, 1e-9, 0); break;
        case 'V': { st(e.a, e.b, 1 / e.R, 0); if (e.ac) { const I = 1 / e.R; if (e.a > 0) br[e.a - 1] += I; if (e.b > 0) br[e.b - 1] -= I; } break; }
        case 'OA': if (e.o > 0) { const o = e.o - 1; ar[o * n + o] += 1 / e.Ro; if (e.p > 0) ar[o * n + e.p - 1] -= e.A / e.Ro; if (e.n > 0) ar[o * n + e.n - 1] += e.A / e.Ro; } break;
      }
    }
    // kısmi pivotlu Gauss eliminasyonu (karmaşık)
    for (let k = 0; k < n; k++) {
      let p = k, mx = -1;
      for (let i = k; i < n; i++) { const m = Math.hypot(ar[i * n + k], ai[i * n + k]); if (m > mx) { mx = m; p = i; } }
      if (p !== k) {
        for (let j = 0; j < n; j++) { let t = ar[k * n + j]; ar[k * n + j] = ar[p * n + j]; ar[p * n + j] = t; t = ai[k * n + j]; ai[k * n + j] = ai[p * n + j]; ai[p * n + j] = t; }
        let t = br[k]; br[k] = br[p]; br[p] = t; t = bi[k]; bi[k] = bi[p]; bi[p] = t;
      }
      const dr = ar[k * n + k], di = ai[k * n + k], dd = dr * dr + di * di || 1e-300;
      for (let i = k + 1; i < n; i++) {
        const xr = ar[i * n + k], xi = ai[i * n + k];
        const fr = (xr * dr + xi * di) / dd, fi = (xi * dr - xr * di) / dd;
        if (!fr && !fi) continue;
        for (let j = k; j < n; j++) {
          const yr = ar[k * n + j], yi = ai[k * n + j];
          ar[i * n + j] -= fr * yr - fi * yi; ai[i * n + j] -= fr * yi + fi * yr;
        }
        br[i] -= fr * br[k] - fi * bi[k]; bi[i] -= fr * bi[k] + fi * br[k];
      }
    }
    const vr = new Float64Array(n + 1), vi = new Float64Array(n + 1);
    for (let i = n - 1; i >= 0; i--) {
      let sr = br[i], si = bi[i];
      for (let j = i + 1; j < n; j++) { const yr = ar[i * n + j], yi = ai[i * n + j]; sr -= yr * vr[j + 1] - yi * vi[j + 1]; si -= yr * vi[j + 1] + yi * vr[j + 1]; }
      const dr = ar[i * n + i], di = ai[i * n + i], dd = dr * dr + di * di || 1e-300;
      vr[i + 1] = (sr * dr + si * di) / dd; vi[i + 1] = (si * dr - sr * di) / dd;
    }
    return { net, vr, vi };
  }
  const cdiv = (a, b) => { const d = b[0] * b[0] + b[1] * b[1]; return [(a[0] * b[0] + a[1] * b[1]) / d, (a[1] * b[0] - a[0] * b[1]) / d]; };
  const deg = (z) => Math.atan2(z[1], z[0]) * 180 / Math.PI;

  /** Akım ölçme direnci: { comp, hi, lo (null = toprak) } — hi tarafı Vi'ye yakın uç */
  function sense(d = curDef()) {
    if (!d) return null;
    const c = B.model.comps.find(k => k.name === d.sense && k.type === 'R'); if (!c) return null;
    const list = B.nodes();
    const n0 = B.nodeOf({ c: c.id, p: 0 }, list), n1 = B.nodeOf({ c: c.id, p: 1 }, list);
    if (!n0 || !n1) return null;
    let hi = n0, lo = n1;
    if (n0.gnd || n1.name === 'Vi') { hi = n1; lo = n0; }
    return { comp: c, hi: hi.name, lo: lo.gnd ? null : lo.name, hiPin: hi.pins[0], loPin: lo.gnd ? null : lo.pins[0] };
  }

  /** Teorik yanıt (Vi düğümüne göre). Dönüş: { H, ph, Irel (A/V), iph, vrRel } */
  let cache = { key: '', map: new Map() };
  function response(f) {
    const key = B.model.version + '|' + curId;
    if (cache.key !== key) cache = { key, map: new Map() };
    if (cache.map.has(f)) return cache.map.get(f);
    let out = null;
    const r = acSolve(f);
    if (r) {
      const list = B.nodes();
      const V = (name) => { const g = list.find(x => x.name === name); if (!g) return null; if (g.gnd) return [0, 0]; const k = r.net.pin(g.pins[0].c, g.pins[0].p); return [r.vr[k], r.vi[k]]; };
      const vi = V('Vi'), vo = V('Vo');
      if (vi && vo && Math.hypot(vi[0], vi[1]) > 1e-12) {
        const H = cdiv(vo, vi);
        out = { H: Math.hypot(H[0], H[1]), ph: deg(H) };
        const s = sense();
        if (s) {
          const a = V(s.hi), b = s.lo ? V(s.lo) : [0, 0];
          if (a && b) { const dv = cdiv([a[0] - b[0], a[1] - b[1]], vi); out.vrRel = Math.hypot(dv[0], dv[1]); out.Irel = out.vrRel / s.comp.value; out.iph = deg(dv); }
        }
      }
    }
    cache.map.set(f, out);
    return out;
  }

  /** Karakteristik frekans: tipe göre faz hedefi / en büyük-en küçük faz / en küçük kazanç */
  function charFreq(d = curDef()) {
    if (!d) return null;
    const t = info(d).target, pts = [];
    for (let e = 0; e <= 500; e++) { const f = Math.pow(10, 0.5 + e * 4.5 / 500); const r = response(f); if (r) pts.push([f, r]); }
    if (!pts.length) return null;
    if (t.ph !== undefined) {
      for (let i = 1; i < pts.length; i++) {
        const a = pts[i - 1][1].ph - t.ph, b = pts[i][1].ph - t.ph;
        if (a === 0) return pts[i - 1][0];
        if (a * b < 0 && Math.abs(a - b) < 90) { let lo = pts[i - 1][0], hi = pts[i][0]; for (let k = 0; k < 40; k++) { const m = Math.sqrt(lo * hi); const v = response(m).ph - t.ph; if ((v < 0) === (a < 0)) lo = m; else hi = m; } return Math.sqrt(lo * hi); }
      }
      return null;
    }
    let best = pts[0];
    for (const p of pts) {
      if (t.minph && p[1].ph < best[1].ph) best = p;
      if (t.maxph && p[1].ph > best[1].ph) best = p;
      if (t.mingain && p[1].H < best[1].H) best = p;
    }
    return best[0];
  }

  /** Şema metni (kılavuzda gösterilir) — tezgâhtaki güncel değerlerle */
  function diagram(d = curDef()) {
    const v = (n) => { const c = B.model.comps.find(k => k.name === n); return c ? fmt(c.value, c.type === 'R' ? 'Ω' : c.type === 'C' ? 'F' : 'H') : '?'; };
    switch (d.type) {
      case 'wien': return `Vi ─ R1(${v('R1')}) ─ A ─ C1(${v('C1')}) ─ Vo ─┬─ C2(${v('C2')}) ─ GND<br>└─ R2(${v('R2')}) ─ GND`;
      case 'rc_lp': return `Vi ─ R1(${v('R1')}) ─ Vo ─ C1(${v('C1')}) ─ GND`;
      case 'cr_hp': return `Vi ─ C1(${v('C1')}) ─ Vo ─ R1(${v('R1')}) ─ GND`;
      case 'rl_hp': return `Vi ─ R1(${v('R1')}) ─ Vo ─ L1(${v('L1')}) ─ GND`;
      case 'lr_lp': return `Vi ─ L1(${v('L1')}) ─ Vo ─ R1(${v('R1')}) ─ GND`;
      case 'rlc_bp': return `Vi ─ L1(${v('L1')}) ─ A ─ C1(${v('C1')}) ─ Vo ─ R1(${v('R1')}) ─ GND`;
      case 'rlc_lp': return `Vi ─ R1(${v('R1')}) ─ A ─ L1(${v('L1')}) ─ Vo ─ C1(${v('C1')}) ─ GND`;
      case 'tank': return `Vi ─ R1(${v('R1')}) ─ Vo ─┬─ L1(${v('L1')}) ─ GND<br>└─ C1(${v('C1')}) ─ GND`;
      case 'rc2_lp': return `Vi ─ R1(${v('R1')}) ─ A ─ R2(${v('R2')}) ─ Vo<br>A ─ C1(${v('C1')}) ─ GND · Vo ─ C2(${v('C2')}) ─ GND`;
      case 'cr2_hp': return `Vi ─ Rs(${v('Rs')}) ─ A ─ C1(${v('C1')}) ─ B ─ C2(${v('C2')}) ─ Vo<br>B ─ R1(${v('R1')}) ─ GND · Vo ─ R2(${v('R2')}) ─ GND`;
      case 'lag': return `Vi ─ R1(${v('R1')}) ─ Vo ─ R2(${v('R2')}) ─ C1(${v('C1')}) ─ GND`;
      case 'lead': return `Vi ─ [R1(${v('R1')}) ∥ C1(${v('C1')})] ─ Vo ─ R2(${v('R2')}) ─ GND`;
      case 'twint': return `Vi ─ Rs(${v('Rs')}) ─ A ─ R1(${v('R1')}) ─ M1 ─ R2(${v('R2')}) ─ Vo ; M1 ─ C3(${v('C3')}) ─ GND<br>A ─ C1(${v('C1')}) ─ M2 ─ C2(${v('C2')}) ─ Vo ; M2 ─ R3(${v('R3')}) ─ GND`;
      case 'rc_loaded': return `Vi ─ R1(${v('R1')}) ─ Vo ─┬─ R2(${v('R2')}) ─ GND<br>└─ C1(${v('C1')}) ─ GND`;
    }
    return '';
  }

  let curId = 'wien';
  function curDef() { return get(curId); }
  function setCurrent(id) { curId = id; }

  return { DEFS, TYPES, get, info, build, response, sense, charFreq, diagram, acSolve, setCurrent, get cur() { return curDef(); }, get curId() { return curId; } };
})();

/* =====================================================================
 * State — osiloskobun tüm kullanıcı ayarları (S) ve çalışma zamanı verisi (R)
 *   Ayarlar Save Setup ile JSON olarak saklanabilir.
 * ===================================================================== */
const State = (() => {
  // Donanım V/div kademeleri (1× prob için): 1 mV … 10 V, 1-2-5
  const VDIV = Units.seq125(1e-3, 10);
  // Zaman tabanı: kılavuzda 5 ns/div … 100 s/div, 1-2-5 (istemde 1 ns yazıyor; kılavuz değeri kullanıldı)
  const TDIV = Units.seq125(5e-9, 100);
  const PERSIST = [0.016, 0.03, 0.06, 0.12, 0.24, 0.5, 1, 2, 4, Infinity, 0]; // Infinity = Infinite, 0 = Off
  const PERSIST_LBL = ['16ms', '30ms', '60ms', '120ms', '240ms', '0.5s', '1s', '2s', '4s', 'Infinite', 'Off'];
  const RL = [1000, 10000, 100000, 1000000, 10000000];
  const ATTEN = (() => { const a = []; for (const m of [1e-3, 1e-2, 1e-1, 1, 10, 100, 1000]) for (const k of [1, 2, 5]) { const v = +(m * k).toPrecision(3); if (v <= 1000) a.push(v); } return a; })();
  const AVG = [2, 4, 8, 16, 32, 64, 128, 256];
  const DIV_X = 10, DIV_Y = 8;
  const ADC_LSB_PER_DIV = 25;   // 8 bit: ±128 kod ≈ ±5.12 div (TAHMIN: GW'nin tipik 25 nokta/div değeri)

  function chDefault(i) {
    return { on: i === 0, vdivIdx: VDIV.indexOf(0.01), pos: 0, coupling: 'DC', invert: false, bw: 'Full',
             expand: 'Ground', atten: 10, probeType: 'Voltage', deskew: 0 };
  }
  /** Fabrika ayarları (Default tuşu). Kılavuz: 100 mV/div, 10 µs/div, Edge/CH1/Auto, 10k, Vector, 240 ms. */
  function defaults() {
    return {
      ch: [chDefault(0), chDefault(1)],      // TAHMIN: varsayılan prob zayıflatması 10X → 10 mV donanım × 10 = 100 mV/div
      tdivIdx: TDIV.indexOf(10e-6), hpos: 0,
      trig: { type: 'Edge', src: 'CH1', slope: 'rise', coupling: 'DC', noiseRej: false, mode: 'Auto', holdoff: 10e-9, level: 0, extAtten: 1 },
      acq: { mode: 'Sample', avgIdx: 3, xy: false, rlIdx: 1 },
      disp: { vector: true, persistIdx: 4, wfInt: 60, gridInt: 55, backlight: 85, grat: 'Full' },
      meas: { items: [], src1: 'CH1', src2: 'CH2', gating: 'Screen', displayAll: null, highlow: 'Auto', stats: false, statN: 100,
              refs: { hi: 90, mid: 50, lo: 10 } },
      cursor: { mode: null, sel: 0, h: [-2, 2], v: [1.5, -1.5], src: 'CH1', hunit: 'S', vunit: 'Base', hRef: null, vRef: null },
      math: { on: false, kind: 'dual', s1: 'CH1', op: '+', s2: 'CH2', pos: 0, vdiv: 1,
              fft: { src: 'CH1', unit: 'dBV', win: 'Hanning', pos: 1, scale: 20, hcenter: null, hdiv: null } },
      ref: [0, 1, 2, 3].map(() => ({ on: false })),
      zoom: { on: false, tdivIdx: TDIV.indexOf(1e-6), pos: 0, knob: 'zoom', play: false },
      autosetMode: 'Fit',
      util: { compFreq: 1000, inkSaver: false, hcAssign: 'Image' },
    };
  }

  let S = defaults();
  /** Çalışma zamanı (kaydedilmez) */
  const R = {
    run: true, single: false, status: 'Auto', lastTrigReal: -1, now: 0,
    rec: null,          // son kayıt {t0, step, n, fs, ch:[Float64Array|null], clip:[bool,bool], trigT, tdiv, mode}
    avg: [null, null], avgN: 0, avgKey: '',
    meas: [], measTime: 0, freq: null, freqTime: 0,
    stats: [],
    msg: null, msgUntil: 0,
    undoAutoset: null,
    stoppedDirty: false,
    persistClear: true,
  };

  const vdiv = (i) => VDIV[S.ch[i].vdivIdx] * S.ch[i].atten;   // ekranda görünen V/div
  const tdiv = () => TDIV[S.tdivIdx];
  /** Örnekleme hızı: kayıt uzunluğu / ekran süresi, en fazla 1 GSa/s (TAHMIN: kayıt ekranı tam kaplar) */
  const fs = () => Math.min(1e9, RL[S.acq.rlIdx] / (DIV_X * tdiv()));
  const rollMode = () => tdiv() >= 0.1 && S.trig.mode === 'Auto' && !R.single && !S.acq.xy;

  function set(newS) { S = newS; api.S = S; }
  function message(text, ms = 2200) { R.msg = text; R.msgUntil = performance.now() + ms; }

  const api = { VDIV, TDIV, PERSIST, PERSIST_LBL, RL, ATTEN, AVG, DIV_X, DIV_Y, ADC_LSB_PER_DIV,
    S, R, defaults, set, vdiv, tdiv, fs, rollMode, message };
  return api;
})();

/* =====================================================================
 * Sim — tezgâh devresini sürekli koşturan sinyal kaynağı
 *   - Bench.netlist() → MNA.Circuit; sabit adımlı transient çözüm
 *   - Her adımda prob uçlarındaki gerilimler (BNC'ye ulaşan, prob anahtarıyla bölünmüş)
 *     kanalın analog ön katı (prob bant genişliği, BW limit, AC kuplaj) filtrelerinden geçirilip
 *     halka tamponlara yazılır. Osiloskop (Acq) bu "analog geçmişi" kendi örnekleme saatiyle örnekler;
 *     böylece yavaş zaman tabanında gerçek aliasing kendiliğinden oluşur.
 *   - Adım: dt = max( min(Tmin/300, tdiv/25), Tmin/20000, tampon sığma sınırı )
 * ===================================================================== */
const Sim = (() => {
  const CAP = 1 << 20, MASK = CAP - 1;
  const ring = { c0: new Float32Array(CAP), c1: new Float32Array(CAP), ext: new Float32Array(CAP), trig: new Float32Array(CAP) };
  let cir = null, net = null, builtVersion = -1, builtComp = -1, builtX10 = '';
  let dt = 1e-6, count = 0, tBase = 0;     // örnek n'in zamanı: tBase + n*dt
  const F = {                               // analog filtre durumları
    ch: [{ p: 0, bw: 0, ac: 0 }, { p: 0, bw: 0, ac: 0 }],
    trig: { lp: 0, hp: 0 },
  };
  let warnings = [], fmax = 1000, fmin = 1000, fsq = 0;
  const HPF_AC = 10;          // TAHMIN: AC kuplaj alt kesim frekansı ≈ 10 Hz
  const X1_BW = 6e6;          // TAHMIN: ×1 prob bant genişliği ≈ 6 MHz
  const TRIG_REJ = 70e3;      // kılavuz: HF/LF Reject filtre köşe frekansı 70 kHz
  const LINE_F = 50;          // AC Line tetik kaynağı (Türkiye şebekesi 50 Hz)

  const a1 = (fc) => 1 - Math.exp(-2 * Math.PI * fc * dt);

  function needRebuild() {
    const m = Bench.model;
    const x10 = m.probes.map(p => p.x10).join();
    return !cir || builtVersion !== m.version || builtComp !== State.S.util.compFreq || builtX10 !== x10;
  }
  /** Netlist'i yeniden kur ve kararlı duruma kadar ısıt (warm-up). */
  function rebuild() {
    const m = Bench.model;
    net = Bench.netlist({ compFreq: State.S.util.compFreq });
    cir = new MNA.Circuit(net.nNodes, net.elems);
    builtVersion = m.version; builtComp = State.S.util.compFreq; builtX10 = m.probes.map(p => p.x10).join();
    warnings = net.warnings;
    fmax = net.freqs.length ? Math.max(...net.freqs) : 1000;
    fmin = net.freqs.length ? Math.min(...net.freqs) : 1000;
    fsq = net.sqFreqs.length ? Math.max(...net.sqFreqs) : 0;
    warmup();
  }
  /** Kararlı duruma oturtma: ~20 periyot (en az 50 ms) kaba adımla koşturulur. */
  function warmup() {
    const dtW = Math.min(1 / fmax / 300, 1e-4);
    const dur = Math.max(20 / fmin, 0.05);
    const cap = cir.nonlin ? 40000 : 400000;
    const n = Math.min(Math.ceil(dur / dtW), cap);
    const save = dt; dt = dtW;
    for (let i = 0; i < n; i++) stepOnce(false);
    dt = save;
    resetRing();
  }
  function resetRing() { count = 0; tBase = cir ? cir.t : 0; }

  /** İstenen adım (zaman tabanına göre) */
  function desiredDt(tdiv, extra = 0) {
    const Tmin = 1 / fmax;
    // kare dalga kenarlarının zamanlaması için daha ince adım (frekans ölçümü 4 haneye kadar doğru çıksın)
    const acc = Math.min(Tmin / 500, fsq ? 1 / fsq / 2000 : Infinity, tdiv / 25);
    const cost = Tmin / 20000;
    const ringFit = (16 * tdiv + extra) / (CAP * 0.9);   // ekran + ön tetik + H position tampona sığmalı
    let d = Math.max(acc, cost, ringFit);
    // küçük farklarla sürekli sıfırlamayı önlemek için 2^(k/4) ızgarasına yuvarla
    d = Math.pow(2, Math.round(Math.log2(d) * 4) / 4);
    return d;
  }
  /** Zaman tabanı değişince adımı ayarla (geçmiş sıfırlanır). */
  function ensure(tdiv, extra = 0) {
    if (needRebuild()) rebuild();
    const d = desiredDt(tdiv, extra);
    if (Math.abs(d / dt - 1) > 1e-9) { dt = d; resetRing(); }
  }

  /** Tek çözücü adımı + kanal ön katı filtreleri + tampona yazma */
  function stepOnce(write = true) {
    cir.step(dt, 'TR');
    const S = State.S, m = Bench.model, v = cir.v;
    const out = [0, 0];
    for (let c = 0; c < 2; c++) {
      const nd = net.probeNode[c];
      let x = nd >= 0 ? v[nd] : 0;
      const pr = m.probes[c];
      if (pr.x10) x /= 10;                         // fiziksel ×10 anahtarı: sinyal 10'a bölünür
      const f = F.ch[c];
      if (!pr.x10) { f.p += a1(X1_BW) * (x - f.p); x = f.p; } else f.p = x;
      const bwf = S.ch[c].bw === '20MHz' ? 20e6 : 100e6;
      f.bw += a1(bwf) * (x - f.bw); x = f.bw;
      f.ac += a1(HPF_AC) * (x - f.ac);
      if (S.ch[c].coupling === 'AC') x = x - f.ac;
      out[c] = x;
    }
    const ext = net.extNode >= 0 ? v[net.extNode] : 0;
    if (!write) return;
    const i = count & MASK;
    ring.c0[i] = out[0]; ring.c1[i] = out[1]; ring.ext[i] = ext;
    ring.trig[i] = trigFilter(trigSource(out[0], out[1], ext, tBase + count * dt));
    count++;
  }
  function trigSource(c0, c1, ext, t) {
    switch (State.S.trig.src) {
      case 'CH2': return c1;
      case 'EXT': return ext * State.S.trig.extAtten;
      case 'LINE': return Math.sin(2 * Math.PI * LINE_F * t);
      default: return c0;
    }
  }
  function trigFilter(x) {
    const f = F.trig, cpl = State.S.trig.coupling;
    if (cpl === 'AC') { f.hp += a1(HPF_AC) * (x - f.hp); return x - f.hp; }
    if (cpl === 'HF') { f.lp += a1(TRIG_REJ) * (x - f.lp); return f.lp; }
    if (cpl === 'LF') { f.hp += a1(TRIG_REJ) * (x - f.hp); return x - f.hp; }
    return x;
  }
  /** Tetik kaynağı/kuplajı değişince tetik tamponunu geçmiş veriden yeniden hesapla */
  function refilterTrig() {
    F.trig.lp = 0; F.trig.hp = 0;
    const n0 = oldestN();
    for (let n = n0; n < count; n++) {
      const i = n & MASK;
      ring.trig[i] = trigFilter(trigSource(ring.c0[i], ring.c1[i], ring.ext[i], tBase + n * dt));
    }
  }

  /** Simülasyonu 'seconds' kadar ilerlet (en fazla maxSteps adım). Gerçekleşen süreyi döndürür. */
  function advance(seconds, maxSteps) {
    if (!cir) rebuild();
    const cap = maxSteps || (cir.nonlin ? 9000 : 30000);   // kare başına hesap bütçesi
    const n = Math.max(0, Math.min(Math.ceil(seconds / dt), cap));
    for (let i = 0; i < n; i++) stepOnce(true);
    return n * dt;
  }

  const oldestN = () => Math.max(0, count - CAP + 1);
  const timeOf = (n) => tBase + n * dt;
  const nowT = () => tBase + (count - 1) * dt;
  const oldestT = () => timeOf(oldestN());
  /** Bir tampondan t anında doğrusal ara değerleme; veri yoksa NaN */
  function at(name, t) {
    const x = (t - tBase) / dt;
    const n = Math.floor(x);
    if (n < oldestN() || n + 1 > count - 1) {
      if (n === count - 1 && x - n < 1e-6) return ring[name][n & MASK];
      return NaN;
    }
    const r = ring[name], fr = x - n;
    const a = r[n & MASK], b = r[(n + 1) & MASK];
    return a + (b - a) * fr;
  }
  /** [t0, t1] aralığında min/max (Peak Detect için) */
  function minmax(name, t0, t1) {
    let n0 = Math.ceil((t0 - tBase) / dt), n1 = Math.floor((t1 - tBase) / dt);
    const lo = oldestN(), hi = count - 1;
    if (n1 < lo || n0 > hi) return null;
    n0 = Math.max(n0, lo); n1 = Math.min(n1, hi);
    const r = ring[name];
    let mn = Infinity, mx = -Infinity;
    if (n1 < n0) { const v = at(name, (t0 + t1) / 2); return isNaN(v) ? null : [v, v]; }
    for (let n = n0; n <= n1; n++) { const v = r[n & MASK]; if (v < mn) mn = v; if (v > mx) mx = v; }
    return [mn, mx];
  }

  /** Autoset için: devreyi 'dur' saniye koştur ve her kanalın BNC gerilimlerini döndür */
  function analyze(dur) {
    if (needRebuild()) rebuild();
    const Tmin = 1 / fmax;
    const cap = cir.nonlin ? 40000 : 300000;
    dt = Math.max(Math.min(Tmin / 200, dur / 2000), dur / cap);
    resetRing();
    advance(dur, cap + 10);
    const n0 = oldestN(), N = count - n0;
    const out = { dt, c0: new Float64Array(N), c1: new Float64Array(N) };
    for (let k = 0; k < N; k++) { const i = (n0 + k) & MASK; out.c0[k] = ring.c0[i]; out.c1[k] = ring.c1[i]; }
    return out;
  }

  return {
    ring, ensure, advance, at, minmax, analyze, refilterTrig, rebuild, needRebuild,
    get dt() { return dt; }, get count() { return count; }, get tBase() { return tBase; },
    nowT, oldestT, timeOf, oldestN, MASK, CAP,
    get warnings() { return warnings; }, get fmax() { return fmax; }, get fmin() { return fmin; },
    get circuit() { return cir; },
  };
})();

/* =====================================================================
 * Acq — osiloskobun edinim (acquisition) motoru
 *   - Tetik: Edge (CH1/CH2/EXT/AC Line), rising/falling/either, histerezis, holdoff,
 *     Auto / Normal / Single, Force-Trig, Roll (≥100 ms/div, Auto)
 *   - ADC: örnekleme hızı fs = min(1 GSa/s, kayıt uzunluğu / ekran süresi), 8 bit (25 kod/div),
 *     ekran dışına taşma (clip) tespiti, küçük ön kat + ADC gürültüsü
 *   - Acquire modları: Sample, Peak Detect, Average (2…256)
 *   - Autoset, 50%
 * ===================================================================== */
const Acq = (() => {
  const MAXN = 20000;           // ekranda tutulan en fazla örnek (hesap bütçesi)
  let nextArm = -Infinity;      // tetiğin yeniden kurulacağı simülasyon zamanı
  let lastTrigT = null;         // son kaydın tetik anı (simülasyon zamanı)
  let realClock = 0, lastRealTrig = -1e9, lastFreqScan = -1;
  let forcePending = false;

  // --- yardımcılar ---
  let spare = null;
  function gauss() {                       // Box–Muller
    if (spare !== null) { const s = spare; spare = null; return s; }
    let u = 0, v = 0; while (u === 0) u = Math.random(); v = Math.random();
    const r = Math.sqrt(-2 * Math.log(u)); spare = r * Math.sin(2 * Math.PI * v); return r * Math.cos(2 * Math.PI * v);
  }
  const ringOf = (src) => src === 'CH2' ? 'c1' : 'c0';
  const chIdx = (src) => src === 'CH2' ? 1 : 0;

  /** Tetik seviyesi BNC birimine çevrilmiş hali (tetik tamponu BNC volt tutar) */
  function levelBnc() {
    const T = State.S.trig;
    if (T.src === 'LINE') return 0;
    if (T.src === 'EXT') return T.level;
    return T.level / State.S.ch[chIdx(T.src)].atten;
  }
  /** Histerezis (gürültüye karşı); Noise Rejection açıkken daha geniş. TAHMIN: 0.1 / 0.5 div */
  function hysteresis() {
    const T = State.S.trig;
    const k = T.noiseRej ? 0.5 : 0.1;
    if (T.src === 'LINE') return 0.05;
    if (T.src === 'EXT') return k * 0.2;
    const c = chIdx(T.src);
    return k * State.VDIV[State.S.ch[c].vdivIdx];
  }

  /** [from, to] simülasyon zamanı aralığında ilk geçerli tetik anını bul (ara değerlemeli). */
  function findTrig(from, to) {
    const dt = Sim.dt, tb = Sim.tBase, r = Sim.ring.trig, M = Sim.MASK;
    let n0 = Math.ceil((from - tb) / dt), n1 = Math.floor((to - tb) / dt);
    n0 = Math.max(n0, Sim.oldestN() + 1); n1 = Math.min(n1, Sim.count - 1);
    if (n1 <= n0) return null;
    const L = levelBnc(), h = hysteresis(), slope = State.S.trig.slope;
    let armR = false, armF = false;
    let prev = r[(n0 - 1) & M];
    for (let n = n0; n <= n1; n++) {
      const v = r[n & M];
      if ((slope === 'rise' || slope === 'either') && armR && prev < L && v >= L) return tb + (n - 1 + (L - prev) / (v - prev)) * dt;
      if ((slope === 'fall' || slope === 'either') && armF && prev > L && v <= L) return tb + (n - 1 + (prev - L) / (prev - v)) * dt;
      if (v < L - h) armR = true;
      if (v > L + h) armF = true;
      prev = v;
    }
    return null;
  }

  /**
   * Kayıt oluştur. tl: ekranın sol kenarının simülasyon zamanı.
   * Her kanal için ekran gerilimi (V) dizisi; ADC kuantalaması ve gürültü dahil.
   */
  function buildRecord(tl, trigT) {
    const S = State.S, tdiv = State.tdiv(), span = State.DIV_X * tdiv;
    const fs = State.fs();
    const N = Math.max(2, Math.min(MAXN, Math.round(span * fs)));
    const step = span / N, n = N + 1;
    const pd = S.acq.mode === 'Peak';
    const rec = { tl, trigT, step, n, fs, tdiv, hpos: S.hpos, ch: [null, null], clip: [false, false], missing: [0, 0],
                  vdiv: [State.vdiv(0), State.vdiv(1)], pos: [S.ch[0].pos, S.ch[1].pos], mode: S.acq.mode };
    for (let c = 0; c < 2; c++) {
      const C = S.ch[c];
      if (!C.on) continue;
      const arr = new Float64Array(n);
      const ring = 'c' + c, vd = State.vdiv(c), atten = C.atten, pos = C.pos;
      const lsbBnc = State.VDIV[C.vdivIdx] / State.ADC_LSB_PER_DIV;
      const sig = Math.sqrt(1e-4 * 1e-4 + (0.07 * lsbBnc) ** 2);   // TAHMIN: 0.1 mV ön kat + 0.07 LSB ADC gürültüsü
      const sgn = C.invert ? -1 : 1, gnd = C.coupling === 'GND';
      let clip = false, miss = 0;
      for (let k = 0; k < n; k++) {
        const t = tl + k * step - C.deskew;
        let v;
        if (pd) { const mm = Sim.minmax(ring, t - step / 2, t + step / 2); v = mm ? mm[k & 1] : NaN; }
        else v = Sim.at(ring, t);
        if (isNaN(v)) { arr[k] = NaN; miss++; continue; }
        if (gnd) v = 0;
        v = (v + sig * gauss()) * atten * sgn;
        const div = v / vd + pos;
        let code = Math.round(div * State.ADC_LSB_PER_DIV);
        if (code > 127) code = 127; else if (code < -128) code = -128;
        if (Math.abs(div) > State.DIV_Y / 2 + 0.08) clip = true;   // ekrandan taşma → ölçüm "?"
        arr[k] = (code / State.ADC_LSB_PER_DIV - pos) * vd;
      }
      rec.ch[c] = arr; rec.clip[c] = clip; rec.missing[c] = miss;
    }

  /** Ana döngüden her karede çağrılır. realDt: gerçek geçen süre (s). */

    const n0 = Math.max(Sim.oldestN(), n1 - Math.min(300000, Math.round(Math.max(2 / Sim.fmin, 10 * State.tdiv()) / Sim.dt)));

  function forceTrig() { forcePending = true; }
  function resetArm() { nextArm = -Infinity; }

  return { tick, autoset, level50, forceTrig, resetArm, markDirty, buildRecord, estFreq, get realClock() { return realClock; } };

    while (i1 > i0 && isNaN(arr[i1])) i1--;

  }

  /** Bir dizinin temel analizi (seviyeler, geçişler) — hesap pahalı olduğundan kaynak başına önbelleklenir */
  function analyze(s) {
    const a = s.arr, n = a.length, refs = State.S.meas.refs;
    let mx = -Infinity, mn = Infinity, sum = 0, sq = 0, miss = 0;
    for (let i = 0; i < n; i++) { const v = a[i]; if (isNaN(v)) { miss++; continue; } if (v > mx) mx = v; if (v < mn) mn = v; sum += v; sq += v * v; }

    const mean = sum / cnt, rms = Math.sqrt(sq / cnt);

    let high = mx, low = mn;
    const hl = State.S.meas.highlow;
    if (hl !== 'MinMax' && mx > mn) {
      const B = 100, hist = new Uint32Array(B), w = (mx - mn) / B;
      for (let i = 0; i < n; i++) if (!isNaN(a[i])) hist[Math.min(B - 1, Math.floor((a[i] - mn) / w))]++;

  }
  /** i noktasından geriye doğru 'lv' seviyesinin geçildiği ara değerlenmiş örnek indisi */

/* =====================================================================
 * MathFn — iki kanal işlemleri (+ − × ÷) ve FFT
 * ===================================================================== */
const MathFn = (() => {
  let dcache = { seq: -1, v: null }, fcache = { seq: -1, v: null };
  const srcArr = (name) => {
    const rec = State.R.rec; if (!rec) return null;
    const c = name === 'CH2' ? 1 : 0;
    return State.S.ch[c].on ? rec.ch[c] : null;
  };
  /** Dual channel math: Source1 op Source2. Dönüş {arr, unit} */
  function dual() {
    const S = State.S, M = S.math, R = State.R;
    const key = R.recSeq + M.s1 + M.op + M.s2;
    if (dcache.seq === key) return dcache.v;
    const a = srcArr(M.s1), b = srcArr(M.s2);
    let v = null;
    if (a && b && a.length === b.length) {
      const arr = new Float64Array(a.length);
      for (let k = 0; k < a.length; k++) {
        switch (M.op) {
          case '+': arr[k] = a[k] + b[k]; break;
          case '−': arr[k] = a[k] - b[k]; break;
          case '×': arr[k] = a[k] * b[k]; break;
          case '÷': arr[k] = Math.abs(b[k]) < 1e-12 ? NaN : a[k] / b[k]; break;
        }
      }
      v = { arr, unit: M.op === '×' ? 'V²' : M.op === '÷' ? '' : 'V' };
    }
    dcache = { seq: key, v };
    return v;
  }

  /** Yerinde radix-2 FFT (re, im) */
  function fft(re, im) {
    const n = re.length;
    for (let i = 1, j = 0; i < n; i++) {
      let bit = n >> 1;
      for (; j & bit; bit >>= 1) j ^= bit;
      j ^= bit;
      if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
    }
    for (let len = 2; len <= n; len <<= 1) {
      const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
      for (let i = 0; i < n; i += len) {
        let cr = 1, ci = 0;
        for (let k = 0; k < len / 2; k++) {
          const a = i + k, b = a + len / 2;
          const tr = re[b] * cr - im[b] * ci, ti = re[b] * ci + im[b] * cr;
          re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;
          const ncr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = ncr;
        }
      }
    }

    Rectangular: () => 1,
    Hanning: (k, N) => 0.5 - 0.5 * Math.cos(2 * Math.PI * k / (N - 1)),
    Hamming: (k, N) => 0.54 - 0.46 * Math.cos(2 * Math.PI * k / (N - 1)),
    Blackman: (k, N) => 0.42 - 0.5 * Math.cos(2 * Math.PI * k / (N - 1)) + 0.08 * Math.cos(4 * Math.PI * k / (N - 1)),
  };

    const S = State.S, F = S.math.fft, R = State.R, rec = R.rec;

      const re = new Float64Array(N), im = new Float64Array(N);
      const w = WIN[F.win] || WIN.Hanning;
      let cg = 0;
      for (let k = 0; k < N; k++) { const wk = w(k, N); cg += wk; re[k] = (isNaN(a[k]) ? 0 : a[k]) * wk; }
      cg /= N;
      fft(re, im);

        m = k === 0 ? m : m * 2 / Math.SQRT2;              // tek taraflı RMS

      }
      const df = 1 / (rec.step * N);
      v = { mag, df, fmax: df * N / 2 };

  }

})();

/* =====================================================================
 * Renderer — 800×480 WVGA ekranın çizimi (Canvas 2D)

    ctx.save();

    if (!App.power) { ctx.restore(); return; }

    pctx.globalAlpha = 0.6 * S.disp.wfInt / 100 + 0.2; pctx.lineWidth = 1.2;

    if (S.disp.vector) {

      const st = Math.max(1, Math.floor(a.length / 5000));
      for (let k = 0; k < a.length; k += st) { if (isNaN(a[k]) || isNaN(b[k])) continue; k ? pctx.lineTo(X(a[k]), Y(b[k])) : pctx.moveTo(X(a[k]), Y(b[k])); }
