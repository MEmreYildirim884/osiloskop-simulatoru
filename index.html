    } else for (let k = 0; k < a.length; k += 2) pctx.fillRect(X(a[k]), Y(b[k]), 1.5, 1.5);
    pctx.restore();
  }
  function drawFFT(rec) {
    const S = State.S, F = S.math.fft;
    const sp = MathFn.spectrum(); if (!sp) return;
    const hdiv = F.hdiv || sp.fmax / 10, hc = F.hcenter ?? sp.fmax / 2;
    const f0 = hc - 5 * hdiv;

    // kanal toprak seviyesi işaretleri (sol kenar)
    for (let c = 0; c < 2; c++) {

    }
    if (S.math.on && S.math.kind === 'dual') { let y = CY - S.math.pos * DH; y = Math.max(GY + 6, Math.min(GY + GH - 6, y)); ctx.fillStyle = COL.math; ctx.fillRect(GX - 12, y - 6, 12, 12); ctx.fillStyle = '#000'; ctx.fillText('M', GX - 6, y); }
    // tetik seviyesi (sağ kenar)
    const T = S.trig;
    if (T.src === 'CH1' || T.src === 'CH2') {
      const c = T.src === 'CH2' ? 1 : 0;
      let y = yOf(T.level, State.vdiv(c), S.ch[c].pos);
      const off = y < GY || y > GY + GH; y = Math.max(GY + 4, Math.min(GY + GH - 4, y));
      ctx.fillStyle = off ? '#ff8a3a' : COL.ch[c];
      ctx.beginPath(); ctx.moveTo(GX + GW + 8, y - 6); ctx.lineTo(GX + GW, y); ctx.lineTo(GX + GW + 8, y + 6); ctx.fill();
      if (App.levelShowUntil > performance.now()) {
        ctx.strokeStyle = COL.ch[c]; ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.moveTo(GX, y + 0.5); ctx.lineTo(GX + GW, y + 0.5); ctx.stroke(); ctx.setLineDash([]);
      }
    }
    // tetik konumu (üst kenar)
    const tdiv = State.tdiv();
    let x = CX - S.hpos / tdiv * DW;
    const offx = x < GX || x > GX + GW; x = Math.max(GX + 5, Math.min(GX + GW - 5, x));
    ctx.fillStyle = '#ff9a2a';
    ctx.beginPath(); ctx.moveTo(x - 6, GY); ctx.lineTo(x + 6, GY); ctx.lineTo(x, GY + 8); ctx.fill();
    if (offx) { ctx.fillText(x < CX ? '◀' : '▶', x + (x < CX ? 10 : -10), GY + 6); }
    ctx.restore();
  }

  /* ---------------- cursor ---------------- */
  function cursorInfo() {
    const S = State.S, Cu = S.cursor, rec = State.R.rec;
    const src = Cu.src, c = src === 'CH2' ? 1 : 0;
    const vd = src === 'Math' ? S.math.vdiv : State.vdiv(c), pos = src === 'Math' ? S.math.pos : S.ch[c].pos;
    const tdiv = State.tdiv();
    const tAt = (xd) => xd * tdiv + S.hpos;           // tetiğe göre zaman
    const arr = src === 'Math' ? (MathFn.dual() || {}).arr : rec && rec.ch[c];
    const vAt = (xd) => { if (!arr) return NaN; const k = Math.round((xd + 5) / 10 * (arr.length - 1)); return arr[Math.max(0, Math.min(arr.length - 1, k))]; };
    const vOf = (yd) => (yd - pos) * vd;
    return { tAt, vAt, vOf, vd, pos };
  }
  function cursors() {
    const S = State.S, Cu = S.cursor;
    const info = cursorInfo();
    ctx.save();
    const col = Cu.src === 'Math' ? COL.math : COL.ch[Cu.src === 'CH2' ? 1 : 0];
    const lines = [];
    const fmtV = (v) => Cu.vunit === '%' && Cu.vRef ? (v / Cu.vRef * 100).toFixed(1) + '%' : Units.fmt(v, 'V');
    const fmtT = (t) => {
      if (Cu.hunit === 'Hz') return Units.fmt(1 / t, 'Hz');
      if ((Cu.hunit === '%' || Cu.hunit === '°') && Cu.hRef) return Cu.hunit === '%' ? (t / Cu.hRef * 100).toFixed(1) + '%' : (t / Cu.hRef * 360).toFixed(1) + '°';
      return Units.fmt(t, 's');
    };
    if (Cu.mode === 'H') {
      Cu.h.forEach((xd, i) => {
        const x = CX + xd * DW;
        ctx.strokeStyle = (Cu.sel === i || Cu.sel === 2) ? '#fff' : '#aaa';
        ctx.setLineDash(Cu.sel === i || Cu.sel === 2 ? [] : [3, 3]);
        ctx.beginPath(); ctx.moveTo(x + 0.5, GY); ctx.lineTo(x + 0.5, GY + GH); ctx.stroke();
      });
      const [a, b] = Cu.h, ta = info.tAt(a), tb = info.tAt(b), va = info.vAt(a), vb = info.vAt(b);
      lines.push(`① ${Units.fmt(ta, 's')} ${fmtV(va)}`, `② ${Units.fmt(tb, 's')} ${fmtV(vb)}`,
        `Δ${fmtT(tb - ta)} Δ${fmtV(vb - va)}`, `dV/dt ${Units.fmt((vb - va) / (tb - ta), 'V/s')}`);
    } else {
      Cu.v.forEach((yd, i) => {
        const y = CY - yd * DH;
        ctx.strokeStyle = (Cu.sel === i || Cu.sel === 2) ? '#fff' : '#aaa';
        ctx.setLineDash(Cu.sel === i || Cu.sel === 2 ? [] : [3, 3]);
        ctx.beginPath(); ctx.moveTo(GX, y + 0.5); ctx.lineTo(GX + GW, y + 0.5); ctx.stroke();
      });
      const va = info.vOf(Cu.v[0]), vb = info.vOf(Cu.v[1]);
      const [a, b] = Cu.h, ta = info.tAt(a), tb = info.tAt(b);
      lines.push(`① ${fmtV(va)}`, `② ${fmtV(vb)}`, `Δ${fmtV(vb - va)}`, `dV/dt ${Units.fmt((vb - va) / (tb - ta), 'V/s')}`);
    }
    ctx.setLineDash([]);
    ctx.font = '12px Consolas, monospace'; ctx.textAlign = 'left';
    const bw = 168, bh = lines.length * 15 + 8;
    ctx.fillStyle = 'rgba(20,24,30,0.85)'; ctx.fillRect(GX + 6, GY + 6, bw, bh);
    ctx.strokeStyle = col; ctx.strokeRect(GX + 6.5, GY + 6.5, bw, bh);
    ctx.fillStyle = '#fff';
    lines.forEach((l, i) => ctx.fillText(l, GX + 12, GY + 14 + i * 15));
    ctx.restore();
  }

  /* ---------------- üst bar ve durum barı ---------------- */
  function topBar() {
    const S = State.S, R = State.R;
    ctx.save(); ctx.textAlign = 'left'; ctx.fillStyle = '#d0d4da';
    const rl = State.RL[S.acq.rlIdx];
    const rlTxt = rl >= 1e6 ? rl / 1e6 + 'M' : rl >= 1e3 ? rl / 1e3 + 'k' : rl;
    ctx.fillText(`${rlTxt} pts   ${Units.fmt(State.fs(), 'Sa/s', 3).replace(/\.0+(?=[a-zµ]|Sa)/, '')}`, 10, 14);
    // hafıza çubuğu
    const mx = 210, mw = 300;
    ctx.strokeStyle = '#777'; ctx.strokeRect(mx + 0.5, 6.5, mw, 14);
    if (!(R.rec && R.rec.roll)) {
      ctx.fillStyle = S.ch[0].on ? COL.ch[0] : COL.ch[1];
      ctx.globalAlpha = 0.6; ctx.fillRect(mx + 2, 9, mw - 3, 9); ctx.globalAlpha = 1;
      const tx = mx + mw / 2 - Math.max(-1, Math.min(1, S.hpos / (5 * State.tdiv()))) * mw / 2;
      ctx.fillStyle = '#ff9a2a'; ctx.beginPath(); ctx.moveTo(tx - 5, 4); ctx.lineTo(tx + 5, 4); ctx.lineTo(tx, 11); ctx.fill();
    }
    // acquire modu
    const am = S.acq.mode === 'Average' ? `Avg ${State.AVG[S.acq.avgIdx]}` : S.acq.mode === 'Peak' ? 'Peak' : 'Sample';
    ctx.fillStyle = '#c8ccd2'; ctx.fillText(am, 525, 14);
    if (S.zoom.on) { ctx.fillStyle = '#7fb0ff'; ctx.fillText('Zoom', 590, 14); }
    // tetik durumu
    const st = R.status;
    const colr = st === 'Stop' ? '#ff5050' : st === "Trig'd" ? '#5fe07a' : st === 'Roll' ? '#7fb0ff' : '#ffb84a';
    ctx.fillStyle = colr; ctx.fillRect(712, 4, 80, 20);
    ctx.fillStyle = '#000'; ctx.font = 'bold 13px Arial'; ctx.textAlign = 'center';
    ctx.fillText(R.single && R.run ? 'Single' : st, 752, 14.5);
    if (R.single && R.run) { ctx.font = '9px Arial'; ctx.fillText(st, 752, 22); }
    ctx.restore();
  }
  function statusBar() {
    const S = State.S, R = State.R;
    const y = 427;
    ctx.save(); ctx.textAlign = 'left'; ctx.font = '12px "Segoe UI", Arial';
    let x = 4;
    const box = (txt, col, w) => {
      ctx.fillStyle = col; ctx.fillRect(x, y - 9, 18, 18);
      ctx.fillStyle = '#000'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center'; ctx.fillText(txt[0], x + 9, y + 0.5);
      ctx.font = '12px "Segoe UI", Arial'; ctx.textAlign = 'left'; ctx.fillStyle = col; ctx.fillText(txt[1], x + 22, y + 0.5);
      x += w;
    };
    const cpl = { DC: 'DC', AC: 'AC', GND: 'GND' };
    for (let c = 0; c < 2; c++) if (S.ch[c].on) box([String(c + 1), `${Units.fmt(State.vdiv(c), 'V')} ${cpl[S.ch[c].coupling]}${S.ch[c].bw === '20MHz' ? ' BW' : ''}${S.ch[c].invert ? ' Inv' : ''}`], COL.ch[c], 116);
    if (S.math.on && S.math.kind === 'dual') box(['M', `${Units.fmt(S.math.vdiv, (MathFn.dual() || {}).unit ?? 'V')}`], COL.math, 90);
    // yatay
    ctx.fillStyle = '#ddd'; x = Math.max(x, 250);
    ctx.fillText(`H ${Units.fmt(State.tdiv(), 's')}`, x, y); ctx.fillText(`${Units.fmt(S.hpos, 's')}`, x + 74, y);
    // tetik
    const T = S.trig, sl = T.slope === 'rise' ? '↗' : T.slope === 'fall' ? '↘' : '↕';
    const tcol = T.src === 'CH1' ? COL.ch[0] : T.src === 'CH2' ? COL.ch[1] : '#ddd';
    ctx.fillStyle = tcol;
    const lv = T.src === 'LINE' ? '' : Units.fmt(T.level, 'V');
    ctx.fillText(`${T.src === 'LINE' ? 'AC Line' : T.src} ${sl} ${lv} ${T.coupling === 'HF' ? 'HFR' : T.coupling === 'LF' ? 'LFR' : T.coupling}`, x + 160, y);
    // frekans sayacı
    ctx.fillStyle = '#ddd'; ctx.textAlign = 'right';
    ctx.fillText(R.freq ? Units.fmt(R.freq, 'Hz', 6) : '<2Hz', 796, y);
    ctx.restore();
  }

  /* ---------------- ölçüm kutusu ---------------- */
  function measBox() {
    const S = State.S;
    if (!S.meas.items.length) return;
    const res = App.measResults || [];
    const cols = 4, bw = GW / cols, bh = S.meas.stats ? 30 : 18;
    const rows = Math.ceil(res.length / cols);
    const y0 = GY + GH - rows * bh - 2;
    ctx.save(); ctx.font = '12px "Segoe UI", Arial'; ctx.textAlign = 'left';
    res.forEach((m, i) => {
      const x = GX + (i % cols) * bw, y = y0 + Math.floor(i / cols) * bh;
      ctx.fillStyle = 'rgba(15,18,24,0.85)'; ctx.fillRect(x + 1, y, bw - 2, bh - 2);
      const col = m.it.s1 === 'Math' ? COL.math : COL.ch[m.it.s1 === 'CH2' ? 1 : 0];
      ctx.fillStyle = col; ctx.fillRect(x + 1, y, 3, bh - 2);
      const lbl = Measure.catOf(m.it.name) === 'D' ? `${m.it.s1}→${m.it.s2} ${m.it.name}` : `${m.it.s1} ${m.it.name}`;
      ctx.fillStyle = '#bbb'; ctx.fillText(lbl, x + 7, y + 8);
      ctx.fillStyle = '#fff'; ctx.textAlign = 'right'; ctx.fillText(m.text, x + bw - 6, y + 8); ctx.textAlign = 'left';
      if (m.stats) { ctx.fillStyle = '#9ab'; ctx.font = '10px Arial'; ctx.fillText(`μ ${Units.fmt(m.stats.mean, m.stats.u)} σ ${Units.fmt(m.stats.sd, m.stats.u)} n${m.stats.n}`, x + 7, y + 21); ctx.font = '12px "Segoe UI", Arial'; }
    });
    ctx.restore();
  }
  function displayAll() {
    const S = State.S, src = S.meas.displayAll;
    ctx.save();
    ctx.fillStyle = 'rgba(12,16,24,0.9)'; ctx.fillRect(GX + 20, GY + 20, GW - 40, 250);
    ctx.strokeStyle = src === 'CH2' ? COL.ch[1] : COL.ch[0]; ctx.strokeRect(GX + 20.5, GY + 20.5, GW - 41, 250);
    ctx.font = '11.5px "Segoe UI", Arial'; ctx.textAlign = 'left';
    ctx.fillStyle = '#fff'; ctx.fillText(`Display All — ${src}`, GX + 30, GY + 34);
    const list = [...Measure.V_LIST, ...Measure.T_LIST];
    list.forEach((n, i) => {
      const col = Math.floor(i / 9), row = i % 9;
      const x = GX + 30 + col * 165, y = GY + 56 + row * 23;
      ctx.fillStyle = '#aab'; ctx.fillText(n, x, y);
      ctx.fillStyle = '#fff'; ctx.fillText(Measure.format(Measure.value({ name: n, s1: src })), x + 78, y);
    });
    ctx.restore();
  }
  function overlayMsg() {
    const R = State.R;
    if (R.msg && performance.now() < R.msgUntil) {
      ctx.save(); ctx.font = '13px "Segoe UI", Arial';
      const w = Math.min(640, ctx.measureText(R.msg).width + 30);
      ctx.fillStyle = 'rgba(30,40,60,0.92)'; ctx.fillRect(CX - w / 2, GY + 40, w, 28);
      ctx.strokeStyle = '#8ab'; ctx.strokeRect(CX - w / 2 + 0.5, GY + 40.5, w, 28);
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(R.msg, CX, GY + 54.5);
      ctx.restore();
    }
  }
  return { init, draw, cursorInfo, W, H, GX, GY, GW, GH, DW, DH, SIDE_X, SIDE_Y, SIDE_H, BOT_Y, BOT_W, COL, get ctx() { return ctx; } };
})();

/* =====================================================================
 * Menus — veri güdümlü alt menü (7 tuş) / yan menü (5 tuş) sistemi
 *   Menü ağacı GDS-1000B kılavuzundan (Bölüm: Vertical, Measure, Cursor, Math, Acquire, Display,
 *   Trigger, Save/Recall, Utility, Reference, Autoset, Zoom). Yazılar cihazdaki gibi İngilizce.
 *
 *   Alt menü öğesi: { label, value?:()=>str, onPress?:()=>void, side?: { title, items:[...] } }
 *   Yan menü öğesi: { label, value?:()=>str, checked?:()=>bool, onPress?:()=>void, variable?:(adım)=>void }
 *   'variable' olan yan öğeye basılınca VARIABLE düğmesi o parametreye bağlanır.
 * ===================================================================== */
const Menus = (() => {
  const M = { cur: null, sideB: -1, varSel: null, hidden: false, list: null, help: false, helpText: null, refSel: 0, saveSet: 0, recallSet: 0, recallRef: 0, wfSrc: 'CH1', wfDest: 0 };
  const S = () => State.S;
  const fmt = Units.fmt;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const cyc = (arr, cur, d = 1) => arr[(arr.indexOf(cur) + d + arr.length) % arr.length];
  function opt(label, getter, setter, val, after) { return { label, checked: () => getter() === val, onPress: () => { setter(val); after && after(); } }; }
  const attenTxt = (a) => (a < 1 ? (a * 1000) + 'mX' : a + 'X');
  const dirty = () => Acq.markDirty();

  /* ---------------- menü tanımları ---------------- */
  function chMenu(c) {
    const C = S().ch[c];
    return [
      { label: 'Coupling', value: () => C.coupling, onPress: () => { C.coupling = cyc(['DC', 'AC', 'GND'], C.coupling); Sim.refilterTrig(); dirty(); } },
      { label: 'Impedance', value: () => '1MΩ' },
      { label: 'Invert', value: () => C.invert ? 'On' : 'Off', onPress: () => { C.invert = !C.invert; dirty(); } },
      { label: 'Bandwidth', value: () => C.bw, side: { title: 'Bandwidth', items: [
        opt('Full', () => C.bw, v => C.bw = v, 'Full'), opt('20MHz', () => C.bw, v => C.bw = v, '20MHz')] } },
      { label: 'Expand', value: () => 'By ' + C.expand, side: { title: 'Expand', items: [
        opt('By Ground', () => C.expand, v => C.expand = v, 'Ground'), opt('By Center', () => C.expand, v => C.expand = v, 'Center')] } },
      { label: 'Position', value: () => fmt(C.pos * State.vdiv(c), 'V'), side: { title: 'Position', items: [
        { label: 'Position', value: () => fmt(C.pos * State.vdiv(c), 'V'), variable: (n) => { C.pos = clamp(C.pos + n * 0.04, -12, 12); dirty(); } },
        { label: 'Set to 0', onPress: () => { C.pos = 0; dirty(); } }] } },
      { label: 'Probe', value: () => `${C.probeType} ${attenTxt(C.atten)}`, side: { title: 'Probe', items: [
        { label: 'Voltage/Current', value: () => C.probeType, onPress: () => { C.probeType = C.probeType === 'Voltage' ? 'Current' : 'Voltage'; } },
        { label: 'Attenuation', value: () => attenTxt(C.atten), variable: (n) => setAtten(c, State.ATTEN[clamp(State.ATTEN.indexOf(C.atten) + Math.sign(n), 0, State.ATTEN.length - 1)]) },
        { label: 'Set to 10X', onPress: () => setAtten(c, 10) },
        { label: 'Deskew', value: () => fmt(C.deskew, 's'), variable: (n) => { C.deskew = clamp(C.deskew + n * 1e-9, -50e-9, 50e-9); dirty(); } },
        { label: 'Set to 0s', onPress: () => { C.deskew = 0; dirty(); } }] } },
    ];
  }
  function setAtten(c, a) {
    const C = S().ch[c], T = S().trig;
    if ((T.src === 'CH1' && c === 0) || (T.src === 'CH2' && c === 1)) T.level *= a / C.atten;
    C.atten = a; dirty();
  }

  const SRC3 = ['CH1', 'CH2', 'Math'];
  function addMeas(name) {
    const m = S().meas;
    if (m.items.length >= 8) { State.message('Maximum 8 measurements can be displayed'); return; }
    m.items.push({ name, s1: m.src1, s2: m.src2 }); Measure.resetStats();
  }
  function openList(title, items, onSelect) { M.list = { title, items, idx: 0, onSelect }; }
  function measureMenu() {
    const m = S().meas;
    return [
      { label: 'Add Measurement', side: { title: 'Add Measurement', items: [
        { label: 'V/I', onPress: () => openList('Voltage / Current', Measure.V_LIST, i => addMeas(Measure.V_LIST[i])) },
        { label: 'Time', onPress: () => openList('Time', Measure.T_LIST, i => addMeas(Measure.T_LIST[i])) },
        { label: 'Delay', onPress: () => openList('Delay', Measure.D_LIST, i => addMeas(Measure.D_LIST[i])) },

        { label: 'Source2', value: () => m.src2, onPress: () => m.src2 = cyc(SRC3, m.src2), variable: (n) => m.src2 = cyc(SRC3, m.src2, Math.sign(n)) }] } },
      { label: 'Remove Measurement', side: { title: 'Remove', items: [
        { label: 'Select Measurement', onPress: () => { if (!m.items.length) return State.message('No measurement'); openList('Remove Measurement', m.items.map(it => `${it.s1} ${it.name}`), i => { m.items.splice(i, 1); Measure.resetStats(); M.list = null; }); } },
        { label: 'Remove All', onPress: () => { m.items = []; Measure.resetStats(); } }] } },
      { label: 'Gating', value: () => ({ Off: 'Off', Screen: 'Screen', Cursors: 'Cursors' })[m.gating], side: { title: 'Gating', items: [
        opt('Off (Full Record)', () => m.gating, v => m.gating = v, 'Off'), opt('Screen', () => m.gating, v => m.gating = v, 'Screen'),
        opt('Between Cursors', () => m.gating, v => m.gating = v, 'Cursors')] } },
      { label: 'Display All', value: () => m.displayAll || 'OFF', side: { title: 'Display All', items: [
        { label: 'Source', value: () => m.displayAll || '—', onPress: () => m.displayAll = m.displayAll === 'CH1' ? 'CH2' : m.displayAll === 'CH2' ? 'Math' : 'CH1' },
        { label: 'OFF', onPress: () => m.displayAll = null }] } },
      { label: 'High-Low', value: () => ({ Histogram: 'Histogram', MinMax: 'Min-Max', Auto: 'Auto' })[m.highlow], side: { title: 'High-Low', items: [
        opt('Histogram', () => m.highlow, v => m.highlow = v, 'Histogram'), opt('Min-Max', () => m.highlow, v => m.highlow = v, 'MinMax'),
        opt('Auto', () => m.highlow, v => m.highlow = v, 'Auto'), { label: 'Set to Defaults', onPress: () => m.highlow = 'Auto' }] } },
      { label: 'Statistics', value: () => m.stats ? 'On' : 'Off', side: { title: 'Statistics', items: [
        { label: 'Statistics', value: () => m.stats ? 'On' : 'Off', onPress: () => { m.stats = !m.stats; Measure.resetStats(); } },
        { label: 'Samples', value: () => String(m.statN), variable: (n) => m.statN = clamp(m.statN + n * (m.statN >= 100 ? 10 : 1), 2, 1000) },
        { label: 'Reset Statistics', onPress: () => Measure.resetStats() }] } },
      { label: 'Reference Levels', side: { title: 'Ref Levels', items: [
        { label: 'High Ref', value: () => m.refs.hi.toFixed(1) + '%', variable: (n) => m.refs.hi = clamp(m.refs.hi + n * 0.5, m.refs.mid + 0.5, 100) },
        { label: 'Mid Ref', value: () => m.refs.mid.toFixed(1) + '%', variable: (n) => m.refs.mid = clamp(m.refs.mid + n * 0.5, m.refs.lo + 0.5, m.refs.hi - 0.5) },
        { label: 'Low Ref', value: () => m.refs.lo.toFixed(1) + '%', variable: (n) => m.refs.lo = clamp(m.refs.lo + n * 0.5, 0, m.refs.mid - 0.5) },
        { label: 'Set to Defaults', onPress: () => m.refs = { hi: 90, mid: 50, lo: 10 } }] } },
    ];
  }
  function cursorMenu() {
    const Cu = S().cursor;
    const selTxt = () => ['①', '②', '①②'][Cu.sel];
    return [
      { label: 'H Cursor', value: () => Cu.mode === 'H' ? selTxt() : 'Off', onPress: () => { if (Cu.mode !== 'H') { Cu.mode = 'H'; Cu.sel = 0; } else Cu.sel = (Cu.sel + 1) % 3; M.varSel = null; } },
      { label: 'V Cursor', value: () => Cu.mode === 'V' ? selTxt() : 'Off', onPress: () => { if (Cu.mode !== 'V') { Cu.mode = 'V'; Cu.sel = 0; } else Cu.sel = (Cu.sel + 1) % 3; M.varSel = null; } },
      { label: 'Source', value: () => Cu.src, side: { title: 'Source', items: SRC3.map(s => opt(s, () => Cu.src, v => Cu.src = v, s)) } },
      { label: 'H Unit', value: () => Cu.hunit, side: { title: 'H Unit', items: ['S', 'Hz', '%', '°'].map(s => opt(s, () => Cu.hunit, v => Cu.hunit = v, s)) } },
      { label: 'V Unit', value: () => Cu.vunit, side: { title: 'V Unit', items: ['Base', '%'].map(s => opt(s, () => Cu.vunit, v => Cu.vunit = v, s)) } },
      { label: 'Set Cursor Pos. As 100%', onPress: () => {
        const inf = Renderer.cursorInfo();
        Cu.hRef = Math.abs(inf.tAt(Cu.h[1]) - inf.tAt(Cu.h[0]));
        Cu.vRef = Cu.mode === 'V' ? Math.abs(inf.vOf(Cu.v[1]) - inf.vOf(Cu.v[0])) : Math.abs(inf.vAt(Cu.h[1]) - inf.vAt(Cu.h[0]));
        State.message('Cursor positions set as 100%');
      } },
      { label: 'Cursor Off', onPress: () => { Cu.mode = null; } },
    ];
  }
  function appMenu() {
    const na = () => State.message('This application is not available in the simulator');   // TAHMIN: APP listesi
    return [{ label: 'Go-NoGo', onPress: na }, { label: 'Data Log', onPress: na }, { label: 'DVM', onPress: na }, { label: 'Remote Disk', onPress: na }];
  }
  function acquireMenu() {
    const A = S().acq;
    return [
      { label: 'Mode', value: () => A.mode === 'Average' ? `Average(${State.AVG[A.avgIdx]})` : A.mode === 'Peak' ? 'Peak Detect' : 'Sample', side: { title: 'Mode', items: [

          const v = it.value ? it.value() : null;

  function fitText(ctx, t, x, y, w) {

    ctx.fillStyle = 'rgba(14,22,36,0.95)'; ctx.fillRect(x0, y0, w, h);

    Ls.items.forEach((s, i) => {

      if (i === Ls.idx) { ctx.fillStyle = '#3b6aa8'; ctx.fillRect(cx - 4, cy - 9, 164, 18); }

  }

<text x="966" y="580" font-size="7.5" text-anchor="middle" fill="#333" font-family="Arial">1MΩ∥16pF  300Vrms CAT I</text>
<text x="966" y="590" font-size="7.5" text-anchor="middle" fill="#333" font-family="Arial">⚠ max</text>
<g id="hlLayer"></g>
</svg>`;
    host.insertAdjacentHTML('afterbegin', s);
    svg = host.querySelector('#panelSvg');
    for (const id in knobs) knobs[id].g = svg.querySelector(`.knob[data-id="${id}"] .rot`);
    bind(host);
    layoutScreen(host);
  }
  function layoutScreen(host) {
    const c = host.querySelector('#screen');
    c.style.left = (SCR.x / 1200 * 100) + '%'; c.style.top = (SCR.y / 620 * 100) + '%';
    c.style.width = (SCR.w / 1200 * 100) + '%'; c.style.height = (SCR.h / 620 * 100) + '%';
  }

  /* ---------------- etkileşim ---------------- */
  const tip = () => document.getElementById('tip');
  function showTip(id, e) {
    const h = HELP[id]; if (!h) return;
    const t = tip(); t.innerHTML = `<b>${h[0]}</b><br>${h[1]}`; t.style.display = 'block'; moveTip(e);
  }
  function moveTip(e) { const t = tip(); t.style.left = Math.min(window.innerWidth - 300, e.clientX + 14) + 'px'; t.style.top = (e.clientY + 18) + 'px'; }
  function hideTip() { tip().style.display = 'none'; }

  function bind(host) {
    svg.querySelectorAll('[data-id]').forEach(el => {
      const id = el.dataset.id;
      el.addEventListener('pointerenter', e => showTip(id, e));
      el.addEventListener('pointermove', moveTip);
      el.addEventListener('pointerleave', hideTip);
    });
    svg.querySelectorAll('.btn').forEach(el => {
      const id = el.dataset.id;
      el.addEventListener('pointerdown', e => { e.preventDefault(); el.classList.add('pressed'); App.press(id); });
      const up = () => el.classList.remove('pressed');
      el.addEventListener('pointerup', up); el.addEventListener('pointerleave', up);
    });
    svg.querySelectorAll('.knob').forEach(el => {
      const id = el.dataset.id;
      // kademeli (1-2-5) düğmeler daha az hassas: yanlışlıkla iki kademe atlamasın
      const px = /scale$/.test(id) ? 18 : 7;
      let drag = null, wacc = 0;
      el.addEventListener('pointerdown', e => {
        e.preventDefault(); el.setPointerCapture(e.pointerId);
        drag = { y: e.clientY, x: e.clientX, acc: 0, moved: 0 };
      });
      el.addEventListener('pointermove', e => {
        if (!drag) return;
        const dy = (drag.y - e.clientY) + (e.clientX - drag.x) * 0.6;   // yukarı/sağa sürükleme = saat yönü
        drag.y = e.clientY; drag.x = e.clientX;
        drag.acc += dy; drag.moved += Math.abs(dy);
        while (Math.abs(drag.acc) >= px) { const s = Math.sign(drag.acc); drag.acc -= s * px; turn(id, s); }
      });
      el.addEventListener('pointerup', () => {
        if (drag && drag.moved < 3 && knobs[id].pushable) { App.push(id); pulse(id); }
        drag = null;
      });
      // Tekerlek: fare çentiği (|Δ| ≥ 50) = 1 kademe; dokunmatik yüzeyin küçük adımları biriktirilir
      el.addEventListener('wheel', e => {
        e.preventDefault();
        let d = e.deltaY * (e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? 100 : 1);
        if (Math.abs(d) >= 50) { wacc = 0; turn(id, d < 0 ? 1 : -1); return; }
        wacc += d;
        if (Math.abs(wacc) >= 40) { turn(id, wacc < 0 ? 1 : -1); wacc = 0; }
      }, { passive: false });
    });
  }
  /** Bir detent dönüş: hızlı ardışık dönüşlerde ivmelenme uygulanır */
  function turn(id, s) {
    const k = knobs[id];
    const now = performance.now();
    const fast = now - (k.last || 0) < 60; k.last = now;
    k.speed = fast ? Math.min((k.speed || 1) + 0.25, 4) : 1;
    k.angle += s * 15;
    k.g.style.transform = `rotate(${k.angle}deg)`;
    App.turn(id, s, Math.round(k.speed));
  }
  function pulse(id) {
    const k = knobs[id], g = k.g;
    g.style.transform = `rotate(${k.angle}deg) scale(.92)`;
    setTimeout(() => g.style.transform = `rotate(${k.angle}deg)`, 130);
  }

  /** Kılavuzdaki "Göster" düğmesi: panel öğelerini yanıp sönen halka ile işaretler */
  let hlTimer = 0;
  function highlight(ids, ms = 4500) {
    const layer = svg.querySelector('#hlLayer');
    layer.innerHTML = '';
    clearTimeout(hlTimer);
    const inv = svg.getScreenCTM().inverse();
    for (const id of [].concat(ids)) {
      const el = svg.querySelector(`[data-id="${id}"]`); if (!el) continue;
      const r = el.getBoundingClientRect();
      const p1 = new DOMPoint(r.left, r.top).matrixTransform(inv), p2 = new DOMPoint(r.right, r.bottom).matrixTransform(inv);
      const pad = 6;
      if (el.classList.contains('knob')) {
        const k = knobs[id];
        layer.insertAdjacentHTML('beforeend', `<circle class="hlRing" cx="${k.x}" cy="${k.y}" r="${k.r + 14}"/>`);
      } else layer.insertAdjacentHTML('beforeend', `<rect class="hlRing" x="${p1.x - pad}" y="${p1.y - pad}" width="${p2.x - p1.x + 2 * pad}" height="${p2.y - p1.y + 2 * pad}" rx="8"/>`);
    }
    const first = svg.querySelector('#hlLayer > *');
    if (first) { const r = first.getBoundingClientRect(); if (r.top < 60 || r.bottom > window.innerHeight) document.getElementById('scopeWrap').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    hlTimer = setTimeout(() => layer.innerHTML = '', ms);
  }

  /** Işıklı tuşların durumunu güncelle (her karede) */
  let ledCache = '';
  function updateLeds() {
    const S = State.S, R = State.R, on = App.power;
    const leds = {
      ch1: on && S.ch[0].on ? 'rgba(255,215,40,.85)' : '', ch2: on && S.ch[1].on ? 'rgba(60,170,255,.85)' : '',
      math: on && S.math.on ? 'rgba(255,70,70,.8)' : '', ref: on && S.ref.some(r => r.on) ? 'rgba(235,235,235,.6)' : '',
      runstop: on ? (R.run ? 'rgba(40,210,80,.85)' : 'rgba(240,50,40,.85)') : '',
      single: on && R.single && R.run ? 'rgba(255,255,255,.95)' : '',
      help: on && Menus.M.help ? 'rgba(255,170,60,.7)' : '',
      zoom: on && S.zoom.on ? 'rgba(120,170,255,.7)' : '',
      power: on ? 'rgba(80,220,120,.35)' : '',
    };
    const key = JSON.stringify(leds); if (key === ledCache) return; ledCache = key;
    for (const id in leds) {
      const r = svg.querySelector(`.btn[data-id="${id}"] .led`);
      if (!r) continue;
      r.setAttribute('fill', leds[id] || 'transparent');
      r.style.mixBlendMode = leds[id] ? (id === 'single' ? 'normal' : 'multiply') : '';
      r.style.filter = leds[id] ? 'drop-shadow(0 0 4px ' + leds[id] + ')' : '';
    }
    const lead = svg.querySelector('.compLead');
    if (lead) lead.setAttribute('opacity', Bench.model.probes.some(p => p.tip && Bench.byId(p.tip.c) && Bench.byId(p.tip.c).type === 'COMP') ? '1' : '0');
  }
  return { build, updateLeds, HELP, showTip, hideTip, moveTip, turn, pulse, highlight, knobs };
})();

/* =====================================================================
 * BenchUI — devre tezgâhı arayüzü (SVG)
 *   Paletten sürükle-bırak · pinlere tıklayıp/sürükleyip kablo · çift tık: değer düzenle
 *   Döndür / Sil / Geri al / Yinele: tezgâhın üstündeki düğmeler (klavye kısayolu yok)
 *   Problar: uç (renkli kanca) ve timsah toprak klipsi (siyah) ayrı ayrı bir pine sürüklenip bırakılır
 *   ya da sağdaki "Problar" kutusundaki listeden bir düğüm seçilir.
 *   Prob gövdesindeki ×1/×10 etiketi fiziksel zayıflatma anahtarıdır.
 *   Değer kutusunun üstünde fare tekerleği: 1-2-5 adımı.
 * ===================================================================== */
const BenchUI = (() => {
  const B = Bench, T = Bench.TYPES;
  let svg, propsEl, warnEl;
  let sel = null;            // {kind:'comp'|'wire', id|index}
  let drag = null;           // sürükleme durumu
  let wiring = null;         // {from:{c,p}, x, y}
  let hoverPin = null;       // kablo/prob sürüklerken yakalanacak pin
  // görünüm (yakınlaştırma/kaydırma): SVG viewBox
  const VB0 = { x: 0, y: 0, w: 1000, h: 460 };
  let view = { ...VB0 }, pan = null, benchActive = false;
  let lastPropsKey = '';
  const SNAP = 20;
  const ANCHOR = [[1000, 70], [1000, 210]], EXT_ANCHOR = [1000, 380];
  const PCOL = ['#e8c400', '#1e9be0'];

  /* ---------------- geri al / yinele ---------------- */
  const undoStack = [], redoStack = [];
  function checkpoint() {
    const s = B.snapshot();
    if (undoStack[undoStack.length - 1] !== s) undoStack.push(s);
    if (undoStack.length > 80) undoStack.shift();
    redoStack.length = 0;
  }
  function undo() {
    if (!undoStack.length) return State.message('Nothing to undo');
    redoStack.push(B.snapshot()); B.restore(undoStack.pop()); sel = null; wiring = null; render();
  }
  function redo() {
    if (!redoStack.length) return;
    undoStack.push(B.snapshot()); B.restore(redoStack.pop()); sel = null; render();
  }

  function init() {
    svg = document.getElementById('benchSvg');
    propsEl = document.getElementById('props');
    warnEl = document.getElementById('benchWarn');
    buildPalette();
    svg.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    svg.addEventListener('dblclick', onDbl);
    svg.addEventListener('pointerover', onHover);
    svg.addEventListener('pointerout', () => Panel.hideTip());
    // yakınlaştırma: tezgâha bir kez tıkladıktan sonra fare tekerleği (sayfa kaydırmasını bozmasın diye)
    svg.addEventListener('pointerleave', () => { benchActive = false; svg.classList.remove('active'); });
    svg.addEventListener('wheel', e => {
      if (!benchActive) return;
      e.preventDefault();
      zoomAt(pt(e), e.deltaY < 0 ? 1 / 1.15 : 1.15);
    }, { passive: false });
    document.getElementById('bZin').onclick = () => zoomAt([view.x + view.w / 2, view.y + view.h / 2], 1 / 1.25);
    document.getElementById('bZout').onclick = () => zoomAt([view.x + view.w / 2, view.y + view.h / 2], 1.25);
    document.getElementById('bZfit').onclick = () => { view = { ...VB0 }; applyView(); };
    document.getElementById('bUndo').onclick = undo;
    document.getElementById('bRedo').onclick = redo;
    document.getElementById('bRot').onclick = rotateSel;
    document.getElementById('bDel').onclick = deleteSel;
    render();
  }

  /* ---------------- bileşen açıklamaları (fare üstünde) ---------------- */
  function fgFreq() { const g = B.model.comps.find(c => c.type === 'FG'); return g ? g.freq : null; }
  function compTip(c) {
    const f = fgFreq(), fmt = Units.fmt;
    const nm = c.name ? c.name + ' — ' : '';
    switch (c.type) {
      case 'R': return [`${nm}Direnç ${fmt(c.value, 'Ω')}`, 'Akıma karşı koyar. Ohm yasası: V = I·R. Frekansa bağlı değildir; gerilim ve akım aynı fazdadır.'];
      case 'C': {
        let s = 'Gerilimdeki değişime karşı koyar. Düşük frekansta neredeyse açık devre, yüksek frekansta neredeyse kısa devre gibidir. Akım, gerilimden 90° öndedir.';
        if (f) s += `<br>Şu anki frekansta (${fmt(f, 'Hz', 4)}): X<sub>C</sub> = 1/(2πfC) = <b>${fmt(1 / (2 * Math.PI * f * c.value), 'Ω', 4)}</b>`;
        return [`${nm}Kondansatör ${fmt(c.value, 'F')}`, s];
      }
      case 'L': return [`${nm}Bobin ${fmt(c.value, 'H')}`, 'Akımdaki değişime karşı koyar. X<sub>L</sub> = 2πfL' + (f ? ` = <b>${fmt(2 * Math.PI * f * c.value, 'Ω', 4)}</b> @ ${fmt(f, 'Hz', 4)}` : '')];
      case 'FG': return [`${nm}Fonksiyon jeneratörü`, `${{ sine: 'Sinüs', square: 'Kare', triangle: 'Üçgen' }[c.wave]}, ${fmt(c.freq, 'Hz', 4)}, ${fmt(c.vpp, 'Vpp')} (yüksüz). İç direnç ${fmt(c.rout, 'Ω')}: yük ağırlaştıkça çıkış biraz düşer. Tıkla → sağda frekans/genlik düğmeleri.`];
      case 'DC': return [`${nm}DC kaynak ${fmt(c.value, 'V')}`, 'Sabit gerilim verir.'];
      case 'GND': return ['Toprak', 'Devrenin 0 V referansı. Osiloskobun şasesi (prob timsahları) de buraya bağlıdır.'];
      case 'D': return [`${nm}Diyot 1N4148`, 'Akımı yalnız anottan katoda geçirir (~0.6–0.7 V düşüm).'];
      case 'OA': return [`${nm}İdeal op-amp`, 'Çok yüksek kazançlı fark yükselteci.'];
      case 'COMP': return ['Prob kompanzasyon çıkışı', 'Osiloskobun ön panelindeki 2 V / 1 kHz kare dalga çıkışı.'];
    }
    return null;
  }
  function onHover(e) {
    if (drag || wiring || palDrag) return;
    const t = e.target, tip = document.getElementById('tip');
    let h = null;
    if (t.dataset && t.dataset.pin) {
      const [c, p] = t.dataset.pin.split(':').map(Number);
      const g = B.nodeOf({ c, p });
      h = [`Uç: ${B.pinLabel({ c, p })}`, `Düğüm <b>${g ? g.name : '?'}</b>${g && g.desc ? ' — ' + g.desc : ''}<br>Tıkla → başka bir uca tıkla = kablo.`];
    } else {
      const cg = t.closest && t.closest('.bench-comp');
      if (cg) h = compTip(B.byId(+cg.dataset.comp));
      else if (t.closest && t.closest('.probe-sw')) h = ['Prob ×1/×10 anahtarı', 'Probun üstündeki fiziksel anahtar. ×10: sinyal 10\'a bölünür, devre daha az yüklenir. CH menüsündeki Probe ayarı bununla aynı olmalı!'];
      else if (t.closest && t.closest('.probe-h')) {
        const ph = t.closest('.probe-h');
        h = ph.dataset.part === 'gnd' ? ['Timsah toprak klipsi', 'Her zaman devrenin TOPRAĞINA takılır. Başka bir noktaya takarsan o noktayı toprağa kısa devre edersin!']
          : ph.dataset.probe === 'ext' ? ['EXT TRIG ucu', 'Harici tetik girişi. Bir düğüme sürükle.'] : [`CH${+ph.dataset.probe + 1} prob ucu`, 'Ölçmek istediğin noktaya sürükleyip bırak (ya da sağdaki listeden seç).'];
      }
    }
    if (!h) { Panel.hideTip(); return; }
    tip.innerHTML = `<b>${h[0]}</b><br>${h[1]}`; tip.style.display = 'block'; Panel.moveTip(e);
  }

  /* ---------------- sembol çizimi ---------------- */
  function symbol(c, selected) {
    const st = 'stroke="#222" stroke-width="2" fill="none" stroke-linecap="round"';
    let g = '';
    switch (c.type) {
      case 'R': g = `<path d="M-40 0H-24l4-9 8 18 8-18 8 18 8-18 8 18 4-9H40" ${st}/>`; break;
      case 'C': g = `<path d="M-40 0H-5M5 0H40M-5 -15V15M5 -15V15" ${st}/>`; break;
      case 'L': g = `<path d="M-40 0H-24a6 6 0 0 1 12 0a6 6 0 0 1 12 0a6 6 0 0 1 12 0a6 6 0 0 1 12 0H40" ${st}/>`; break;
      case 'D': g = `<path d="M-40 0H40M-11 -12V12L11 0Z" ${st}/><path d="M11 -12V12" ${st}/><path d="M-11 -12L11 0L-11 12Z" fill="#222"/>`; break;
      case 'FG': {
        const w = c.wave === 'square' ? 'M-12 6V-6H0V6H12V-6' : c.wave === 'triangle' ? 'M-13 5L-6.5 -6L0 5L6.5 -6L13 5' : 'M-13 0C-8 -14 -4 -14 0 0S8 14 13 0';
        g = `<path d="M0 -40V-22M0 22V40" ${st}/><circle r="22" fill="#fff" stroke="#222" stroke-width="2"/><path d="${w}" ${st}/><text x="8" y="-26" font-size="12" fill="#c00">+</text>`; break;
      }
      case 'DC': g = `<path d="M0 -40V-5M0 5V40M-15 -5H15M-8 5H8" ${st}/><text x="10" y="-12" font-size="12" fill="#c00">+</text>`; break;
      case 'GND': g = `<path d="M0 -20V0M-13 0H13M-8 5H8M-3 10H3" ${st}/>`; break;
      case 'OA': g = `<path d="M-40 -20H-28M-40 20H-28M28 0H40" ${st}/><path d="M-28 -32V32L30 0Z" fill="#fff" stroke="#222" stroke-width="2"/><text x="-24" y="-15" font-size="14">−</text><text x="-24" y="25" font-size="13">+</text>`; break;
      case 'COMP': g = `<rect x="-42" y="-34" width="62" height="68" rx="5" fill="#cfd2d5" stroke="#555" stroke-width="1.5"/><path d="M20 -20H40M20 20H40" ${st}/>
        <text x="-11" y="-18" font-size="9" text-anchor="middle" font-weight="700">PROBE</text><text x="-11" y="-7" font-size="9" text-anchor="middle" font-weight="700">COMP</text>
        <text x="-11" y="10" font-size="9" text-anchor="middle">2V ⊓</text><text x="-11" y="22" font-size="9" text-anchor="middle">1kHz</text>
        <text x="27" y="-24" font-size="8.5">⊓</text><text x="27" y="31" font-size="9">⏚</text>`; break;
    }
    const hb = c.type === 'GND' ? 'x="-16" y="-22" width="32" height="38"' : c.type === 'FG' || c.type === 'DC' ? 'x="-26" y="-42" width="52" height="84"' : c.type === 'OA' ? 'x="-42" y="-36" width="84" height="72"' : c.type === 'COMP' ? 'x="-44" y="-36" width="86" height="72"' : 'x="-42" y="-18" width="84" height="36"';
    return `<g class="bench-comp" data-comp="${c.id}" transform="translate(${c.x},${c.y}) rotate(${(c.rot || 0) * 90})">
      <rect ${hb} rx="4" fill="${selected ? 'rgba(60,120,230,.13)' : 'transparent'}" stroke="${selected ? '#3b78e0' : 'none'}" stroke-dasharray="4 3"/>${g}</g>`;
  }
  function label(c) {
    let t = '';
    switch (c.type) {
      case 'R': t = Units.fmt(c.value, 'Ω'); break;
      case 'C': t = Units.fmt(c.value, 'F'); break;
      case 'L': t = Units.fmt(c.value, 'H'); break;
      case 'D': t = '1N4148'; break;
      case 'DC': t = Units.fmt(c.value, 'V'); break;
      case 'FG': t = `${{ sine: 'Sine', square: 'Square', triangle: 'Triangle' }[c.wave]} ${Units.fmt(c.freq, 'Hz', 4)}|${Units.fmt(c.vpp, 'Vpp')}${c.offset ? ' ' + Units.fmt(c.offset, 'V') + ' DC' : ''}|Rout ${Units.fmt(c.rout, 'Ω')}`; break;
      case 'OA': t = 'ideal'; break;
      default: return '';
    }
    if (c.name) t = `<tspan font-weight="700" fill="#7a2e00">${c.name}</tspan> ` + t;
    const vert = (c.rot || 0) % 2 === 1;
    let x = c.x, y = c.y, anchor = 'middle';
    if (c.type === 'FG' || c.type === 'DC') { x = c.x + (vert ? 0 : -30); y = c.y - (vert ? 30 : 6); anchor = vert ? 'middle' : 'end'; }
    else if (vert) { x = c.x + 18; anchor = 'start'; } else y = c.y - 20;
    return t.split('|').map((s, i) => `<text x="${x}" y="${y + i * 14}" font-size="12.5" text-anchor="${anchor}" fill="#1b3a6b" font-family="Segoe UI,Arial" pointer-events="none">${s}</text>`).join('');
  }
  function wirePath(a, b) {
    const [ax, ay] = a, [bx, by] = b;
    return `M${ax} ${ay}H${bx}V${by}`;
  }
  const pinXY = (r) => { const c = B.byId(r.c); return c ? B.pinPos(c, r.p) : null; };

  /** Düğüm adı etiketleri (Vi, A, Vo …) */
  function netTags() {
    let s = '';
    for (const k in B.model.netNames) {
      const [c, p] = k.split(':').map(Number);
      const xy = pinXY({ c, p }); if (!xy) continue;
      const name = B.model.netNames[k], w = 12 + name.length * 8;
      const x = xy[0] + 10, y = xy[1] + 9;
      s += `<g class="netTag"><path d="M${xy[0] + 3} ${xy[1] + 3} L${x + 2} ${y + 4}" stroke="#c0392b" stroke-width="1.2"/>
        <rect x="${x}" y="${y}" width="${w}" height="18" rx="9" fill="#c0392b"/><text x="${x + w / 2}" y="${y + 13}" font-size="12" font-weight="700" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial">${name}</text></g>`;
    }
    return s;
  }

  /* ---------------- probe çizimi ---------------- */
  function probeSvg(p, i) {
    const tip = p.tip && pinXY(p.tip) ? pinXY(p.tip) : p.tipXY;
    const gnd = p.gnd && pinXY(p.gnd) ? pinXY(p.gnd) : p.gndXY;
    const col = PCOL[i], [ax, ay] = ANCHOR[i];
    const bx = tip[0] - 66, by = tip[1] - 40;   // gövde ucun üst-solunda (değer etiketlerini örtmesin)
    return `<g>
      <path d="M${bx + 52} ${by} C ${bx + 140} ${by}, ${ax - 120} ${ay}, ${ax} ${ay}" stroke="#333" stroke-width="5" fill="none" opacity=".85"/>
      <path d="M${bx + 20} ${by + 8} C ${bx + 20} ${by + 50}, ${gnd[0]} ${gnd[1] - 40}, ${gnd[0]} ${gnd[1] - 9}" stroke="#111" stroke-width="2" fill="none" pointer-events="none"/>
      <g class="probe-h" data-probe="${i}" data-part="tip">
        <path d="M${tip[0]} ${tip[1]} L${bx + 50} ${by + 6}" stroke="#999" stroke-width="3"/>
        <circle cx="${tip[0]}" cy="${tip[1]}" r="6" fill="${p.tip ? col : 'none'}" fill-opacity=".35" stroke="${col}" stroke-width="2.5"/>
        <rect x="${bx}" y="${by - 8}" width="56" height="16" rx="7" fill="${col}" stroke="#333"/>
        <text x="${bx + 6}" y="${by + 4}" font-size="10" font-weight="700" fill="#222">CH${i + 1}</text>

  /* ---------------- özellik paneli ---------------- */
